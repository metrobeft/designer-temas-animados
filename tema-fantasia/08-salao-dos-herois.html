<script>
/*FK_JS_BEGIN*/
/* ================= FANTASY SOUND — tudo sintetizado com Web Audio ================= */
const FS=(()=>{
  const KEY='fantasia-sfx',R=Math.random;let ctx=null,master=null,verb=null,on=true,fired=false,lastSpark=0;
  try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  const emit=v=>setTimeout(()=>document.dispatchEvent(new CustomEvent('fk-sound',{detail:v})),0);
  /* reverb de salão de pedra: convolução com ruído que decai */
  function makeVerb(){const len=ctx.sampleRate*2.8|0,b=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(R()*2-1)*Math.pow(1-i/len,3.4)}
    const cv=ctx.createConvolver();cv.buffer=b;const g=ctx.createGain();g.gain.value=.34;cv.connect(g).connect(master);return cv}
  function ensure(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();const cp=ctx.createDynamicsCompressor();master=ctx.createGain();master.gain.value=.9;master.connect(cp).connect(ctx.destination);verb=makeVerb()}catch(e){return null}}
    const go=()=>{if(on&&!fired&&ctx.state==='running'){fired=true;emit(true)}};if(ctx.state!=='running')ctx.resume().then(go).catch(()=>{});else go();return ctx}
  const ok=()=>on&&!!ctx&&ctx.state==='running';

  if(type==='leaves'){for(let i=0;i<46;i++){const a=R()*TAU;P.push({t:'leaf',x:b.cx+Math.cos(a)*b.w*.7,y:b.cy+Math.sin(a)*b.h*.4,a,rad:b.w*(.45+R()*.4),cy:b.cy,cx:b.cx,sp:(.03+R()*.03)*(R()<.5?-1:1),fall:0,life:1,dec:.005+R()*.004,s:5+R()*6,rot:R()*TAU,c:FK.rnd(['#46d39a','#7fe0a8','#2f9a62','#c8ffe0','#e8d27a'])})}}
  if(type==='sparks'){const hx=b.cx+b.w*.28,hy=b.top+b.h*.3;for(let k=0;k<3;k++)setTimeout(()=>{for(let i=0;i<40;i++){const a=-Math.PI/2+(R()-.5)*2.4,v=3+R()*7;P.push({t:'spark',x:hx+(R()-.5)*20,y:hy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,dec:.012+R()*.014,c:FK.rnd(['#fff0b0','#ffb35a','#ff7a1a'])})}FK.burst(hx,hy,16,1.4,['#ffb35a','#fff0b0','#ff7a1a'])},k*260)}
  if(type==='runes'){for(let i=0;i<22;i++)P.push({t:'rune',g:FK.rnd(FK.RUNES),a:i/22*TAU,rad:b.w*.62,cx:b.cx,cy:b.cy,sp:.025,rise:0,life:1,dec:.0055+R()*.002,s:16+R()*10,c:FK.rnd(['#e0d4ff','#b89cff','#8fd8ff'])});FK.burst(b.cx+b.w*.3,b.top+b.h*.38,26,1.5,['#d9b8ff','#8fd8ff','#ffffff'])}}
function drawFx(){fx.clearRect(0,0,W,H);if(!P.length)return;fx.globalCompositeOperation='lighter';
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.life-=p.dec;if(p.life<=0){P.splice(i,1);continue}fx.globalAlpha=Math.min(1,p.life*1.6);
    if(p.t==='mote'){p.x+=p.vx;p.y+=p.vy;fx.fillStyle=p.c;fx.beginPath();fx.arc(p.x,p.y,p.s,0,TAU);fx.fill();fx.globalAlpha*=.25;fx.beginPath();fx.arc(p.x,p.y,p.s*3.5,0,TAU);fx.fill()}
    else if(p.t==='spark'){p.vy+=.22;p.vx*=.985;const ox=p.x,oy=p.y;p.x+=p.vx;p.y+=p.vy;fx.strokeStyle=p.c;fx.lineWidth=2;fx.beginPath();fx.moveTo(ox-p.vx*1.5,oy-p.vy*1.5);fx.lineTo(p.x,p.y);fx.stroke()}
    else if(p.t==='leaf'){p.a+=p.sp;p.fall+=.6;p.rad*=.995;p.rot+=.08;p.x=p.cx+Math.cos(p.a)*p.rad;p.y=p.cy+Math.sin(p.a)*p.rad*.5+p.fall;fx.save();fx.globalCompositeOperation='source-over';fx.translate(p.x,p.y);fx.rotate(p.rot);fx.fillStyle=p.c;fx.beginPath();fx.ellipse(0,0,p.s,p.s*.45,0,0,TAU);fx.fill();fx.strokeStyle='rgba(20,60,30,.6)';fx.lineWidth=1;fx.beginPath();fx.moveTo(-p.s,0);fx.lineTo(p.s,0);fx.stroke();fx.restore()}
    else if(p.t==='rune'){p.a+=p.sp;p.rise+=.9;p.rad*=1.004;const x=p.cx+Math.cos(p.a)*p.rad,y=p.cy+Math.sin(p.a)*p.rad*.35-p.rise;fx.fillStyle=p.c;fx.font=`${p.s}px 'Noto Sans Runic','Segoe UI Historic',serif`;fx.textAlign='center';fx.fillText(p.g,x,y);fx.globalAlpha*=.3;fx.font=`${p.s*1.6}px 'Noto Sans Runic','Segoe UI Historic',serif`;fx.fillText(p.g,x,y+p.s*.2)}}
  fx.globalAlpha=1;fx.globalCompositeOperation='source-over'}
function sound(type){if(type==='rays'){FS.fanfare(.05);FS.sword(.06)}else if(type==='leaves'){FS.arp(9,.05,.06);FS.whoosh(.9,.06);setTimeout(()=>FS.arp(13,.035,.05),420)}else if(type==='sparks'){[0,260,520].forEach((d,i)=>setTimeout(()=>FS.clang(.13-i*.02),d));FS.fire(1,.1);setTimeout(()=>FS.horn(98,1.4,.05),700)}else{FS.magic(.045);setTimeout(()=>FS.shimmer(.025),300);FS.tone(FS.note(7),2.4,.03,'sine',0,FS.note(14),.8)}}
/* ================= GRUPO ================= */
const slotsEl=$('#slots');
function renderParty(newId){slotsEl.innerHTML='';for(let i=0;i<4;i++){const id=party[i],h=HEROES.find(x=>x.id===id),s=document.createElement('div');s.className='slot'+(h?' f':'')+(h&&h.id===newId?' new':'');
    if(h){s.style.backgroundImage=`url(${h.img})`;s.style.backgroundPosition=h.face;s.title=h.name;s.addEventListener('click',()=>select(HEROES.indexOf(h)))}else s.title='vaga livre';slotsEl.appendChild(s)}
  $('#party').classList.toggle('full',party.length===4);try{localStorage.setItem('fantasia-grupo',JSON.stringify(party))}catch(e){}place()}
function choose(){const h=HEROES[sel],el=heroEls[sel];FS.ensure();el.classList.remove('power');void el.offsetWidth;el.classList.add('power');setTimeout(()=>el.classList.remove('power'),2000);
  effect(h.fx);sound(h.fx);const b=heroBox(),txt=`${h.short} SE JUNTA À JORNADA!`,size=Math.max(18,Math.min(40,innerWidth*1.5/txt.length));
  if(!party.includes(h.id)){party.push(h.id);renderParty(h.id);FK.float(txt,b.cx,Math.max(80,b.top+30),{size,color:h.col2,glow:h.col,rot:-3});
    if(party.length===4)setTimeout(()=>{FK.float('O GRUPO ESTÁ COMPLETO!',innerWidth/2,innerHeight*.45,{size:Math.min(48,innerWidth/16),glow:'#ffcf5a'});FS.fanfare(.055);for(let i=0;i<5;i++)setTimeout(()=>FK.burst(R()*innerWidth,R()*innerHeight*.6,24,1.6),i*180)},1500)}
  else FK.float(`${h.short}: PODER LIBERADO!`,b.cx,Math.max(80,b.top+30),{size:Math.max(18,size*.9),color:h.col2,glow:h.col,rot:-3});
  updBtn()}
$('#choose').addEventListener('click',e=>{e.stopPropagation();choose()});
$('#prev').addEventListener('click',e=>{e.stopPropagation();select(sel-1)});$('#next').addEventListener('click',e=>{e.stopPropagation();select(sel+1)});
$('#clr').addEventListener('click',e=>{e.stopPropagation();if(!party.length)return;party=[];renderParty();updBtn();FS.page(.05);FK.float('o grupo se dispersa…',innerWidth/2,innerHeight*.5,{size:24,color:'#f1e2bf'})});
addEventListener('keydown',e=>{if(document.getElementById('fk-eye'))return;const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){select(sel-1)}else if(k==='ArrowRight'||k==='d'||k==='D'){select(sel+1)}
  else if(k==='Enter'||k===' '){e.preventDefault();if(!e.repeat)choose()}else if(k>='1'&&k<='4'){select(+k-1)}});
/* toque: arrastar para trocar */
let tx0=null;stage.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(tx0===null)return;const dx=e.changedTouches[0].clientX-tx0;if(Math.abs(dx)>50)select(sel+(dx<0?1:-1));tx0=null});

/* ================= AMBIENTE SONORO ================= */
let padH=null;
function ambStart(){if(padH||!FS.ok())return;padH=FS.pad([73.42,110,146.83,174.61,220],.006,'triangle',.85)}
function ambStop(){if(padH){padH.stop();padH=null}}
document.addEventListener('fk-sound',e=>e.detail?ambStart():ambStop());
(function crackle(){if(padH&&FS.ok())FS.noise(.03+R()*.05,{v:.008+R()*.016,type:'highpass',f0:1400+R()*2200,f1:700,wet:.35});setTimeout(crackle,70+R()*320)})();
setInterval(()=>{if(padH&&FS.ok()&&R()<.5)FS.harp(7+(R()*8|0),0,.016)},2400);

addEventListener('resize',resize);resize();renderParty();select(0,true);requestAnimationFrame(frame);
FK.ready.then(()=>{FS.strum([7,9,11,14],.03)});
</script>
