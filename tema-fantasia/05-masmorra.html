<script>
/*FK_JS_BEGIN*/
/* ================= FANTASY SOUND — tudo sintetizado com Web Audio ================= */
const FS=(()=>{
  const KEY='fantasia-sfx',R=Math.random;let ctx=null,master=null,verb=null,on=true,fired=false,lastSpark=0;
  try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  const emit=v=>setTimeout(()=>document.dispatchEvent(new CustomEvent('fk-sound',{detail:v})),0);
  /* reverb de salão de pedra: convolução com ruído que decai */
  function makeVerb(){const len=ctx.sampleRate*2.8|0,b=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(R()*2-1)*Math.pow(1-i/len,3.4)}
    const cv=ctx.createConvolver();cv.buffer=b;const g=ctx.createGain();g.gain.value=.34;cv.connect(g).connect(master);return cv}
  function ensure(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();const cp=ctx.createDynamicsCompressor();master=ctx.createGain();master.gain.value=.9;master.connect(cp).connect(ctx.destination);verb=makeVerb()}catch(e){return null}}
    const go=()=>{if(on&&!fired&&ctx.state==='running'){fired=true;emit(true)}};if(ctx.state!=='running')ctx.resume().then(go).catch(()=>{});else go();return ctx}
  const ok=()=>on&&!!ctx&&ctx.state==='running';
  function route(node,wet=.3){node.connect(master);if(wet>0&&verb){const s=ctx.createGain();s.gain.value=wet;node.connect(s);s.connect(verb)}}
  /* ré dórico, de D3 a C6 — soa "medieval" */
  const MODE=[146.83,164.81,174.61,196,220,246.94,261.63,293.66,329.63,349.23,392,440,493.88,523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5];
  const note=i=>MODE[Math.max(0,Math.min(MODE.length-1,i|0))];
  function tone(f,d=.6,v=.05,type='sine',when=0,f2,wet=.3){if(!ok())return;const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);route(g,wet);o.start(t);o.stop(t+d+.05)}
  function noise(d=.4,o={}){if(!ok())return;const v=o.v??.08,type=o.type||'bandpass',f0=o.f0||800,f1=o.f1||f0,q=o.q??1,when=o.when||0,at=o.attack??.01;const t=ctx.currentTime+when,b=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*d|0),ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g);route(g,o.wet??.2);s.start(t);s.stop(t+d+.05)}
  /* ruído contínuo (vento, fogo, rio...): devolve {filter,gain,stop()} */
  function loopNoise(color='pink',wet=.15){if(!ok())return null;const len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);let l=0,b0=0,b1=0,b2=0;
    for(let i=0;i<len;i++){const w=R()*2-1;if(color==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else if(color==='white'){d[i]=w*.5}else{b0=.99765*b0+w*.099046;b1=.963*b1+w*.2965164;b2=.57*b2+w*1.0526913;d[i]=(b0+b1+b2+w*.1848)*.18}}
    const s=ctx.createBufferSource();s.buffer=b;s.loop=true;const f=ctx.createBiquadFilter(),g=ctx.createGain();g.gain.value=0;s.connect(f).connect(g);route(g,wet);s.start();return {src:s,filter:f,gain:g,stop(){try{g.gain.setTargetAtTime(0,ctx.currentTime,.1);setTimeout(()=>s.stop(),500)}catch(e){}}}}
  /* trompa / corneta: serra filtrada com ataque lento */
  function horn(f=146.83,d=1.2,v=.05,when=0){if(!ok())return;const t=ctx.currentTime+when,g=ctx.createGain(),lp=ctx.createBiquadFilter();lp.type='lowpass';lp.Q.value=2;lp.frequency.setValueAtTime(240,t);lp.frequency.linearRampToValueAtTime(1500,t+.14);lp.frequency.exponentialRampToValueAtTime(650,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.09);g.gain.setValueAtTime(v,t+d*.65);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    [1,1.004,.5].forEach((m,i)=>{const o=ctx.createOscillator();o.type=i===2?'triangle':'sawtooth';o.frequency.setValueAtTime(f*m*.98,t);o.frequency.linearRampToValueAtTime(f*m,t+.07);o.connect(lp);o.start(t);o.stop(t+d+.05)});lp.connect(g);route(g,.45)}
  /* camada contínua de acordes (ambiente das páginas): devolve {set(v),stop()} */
  function pad(freqs,v=.012,type='sine',wet=.6){if(!ok())return null;const t=ctx.currentTime,g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+3);route(g,wet);
    const os=freqs.map((f,i)=>{const o=ctx.createOscillator();o.type=type;o.frequency.value=f*(1+(i%2?.003:-.003));o.connect(g);o.start();return o});
    return {g,os,set(x){g.gain.setTargetAtTime(x,ctx.currentTime,.5)},stop(){g.gain.setTargetAtTime(0,ctx.currentTime,.4);setTimeout(()=>os.forEach(o=>{try{o.stop()}catch(e){}}),1600)}}}
  const api={get on(){return on},ready:()=>!!ctx&&ctx.state==='running',ok,ensure,tone,noise,loopNoise,horn,pad,route,MODE,note,ctx:()=>ctx,out:()=>master,verb:()=>verb,
    toggle(){on=!on;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}fired=false;if(on){ensure();setTimeout(()=>api.arp(7,.03),150)}else emit(false);document.querySelectorAll('.fk-snd').forEach(b=>b.textContent=on?'🔊 SOM':'🔇 SOM');return on},
    /* harpa: índice na escala MODE */
    harp(i=7,when=0,v=.05){const f=note(i);tone(f,2.2,v,'triangle',when,null,.45);tone(f*2,.8,v*.35,'sine',when,null,.45);tone(f*3,.25,v*.12,'sine',when,null,.3)},
    arp(start=7,v=.04,gap=.07){[0,2,4,7,9,11].forEach((k,i)=>api.harp(start+k,i*gap,v))},
    strum(notes=[7,9,11,14],v=.04){notes.forEach((k,i)=>api.harp(k,i*.025,v))},
    /* sino de igreja: parciais inarmônicas */
    bell(f=196,v=.07,when=0){[[.5,1],[1,.8],[1.19,.55],[1.56,.4],[2,.5],[2.51,.25],[3.01,.18],[4.1,.1]].forEach(([p,a],i)=>tone(f*p,4/(1+i*.35),v*a,'sine',when,null,.6))},
    /* metal: espada, bigorna */
    clang(v=.12,f){f=f||620+R()*140;[1,2.71,5.15,8.2].forEach((p,i)=>tone(f*p,1.1/(1+i*.8),v/(1+i*1.2),'sine',0,null,.5));noise(.14,{v:v*.7,type:'highpass',f0:3200,f1:1500,wet:.4})},
    sword(v=.08){noise(.35,{v:v*.9,type:'bandpass',f0:1200,f1:6000,q:2,attack:.2,wet:.2});setTimeout(()=>api.clang(v*.7,1400+R()*300),300)},
    drum(v=.25,when=0){tone(110,.6,v,'sine',when,42,.35);noise(.25,{v:v*.35,type:'lowpass',f0:900,f1:120,when,wet:.3})},
    impact(v=.35){tone(92,1.3,v,'sine',0,28,.5);noise(.7,{v:v*.5,type:'lowpass',f0:1800,f1:70,wet:.6})},
    whoosh(d=.5,v=.07){noise(d,{v,f0:280,f1:3400,q:1.1,attack:d*.45,wet:.25})},
    shimmer(v=.02){for(let i=0;i<7;i++)tone(note(13+(R()*8|0))*2,.7,v,'sine',i*.045,null,.7)},

function torch(x,y,T){c.save();c.translate(x,y);c.lineCap='round';c.strokeStyle='#2a170a';c.lineWidth=8;c.beginPath();c.moveTo(3,10);c.lineTo(15,62);c.stroke();c.strokeStyle='#6b4220';c.lineWidth=3;c.beginPath();c.moveTo(2,9);c.lineTo(14,60);c.stroke();
  c.fillStyle='#4a3018';c.beginPath();c.ellipse(3,10,7,4.5,.25,0,TAU);c.fill();c.globalCompositeOperation='lighter';const k=1+bE*.5;
  [['rgba(255,80,20,.55)',1],['rgba(255,165,60,.7)',.72],['rgba(255,245,200,.92)',.44]].forEach(([cl,s],i)=>{const h=30*s*k*(1+.12*Math.sin(T*.02+i*2)+(R()-.5)*.12),w=10*s*k,sw=Math.sin(T*.011+i)*3;c.fillStyle=cl;c.beginPath();c.moveTo(-w,6);c.quadraticCurveTo(-w*1.15,-h*.4,sw,-h);c.quadraticCurveTo(w*1.15,-h*.4,w,6);c.quadraticCurveTo(0,11,-w,6);c.fill()});c.restore()}
function hit(x,y,near){const tol=near?1.25:1;
  for(const ch of chests){const w=ch.u*1.25*tol,h=ch.u*1.1*tol;if(!ch.open&&Math.abs(x-ch.x)<w/2&&y<ch.y+8&&y>ch.y-h)return {k:'chest',o:ch,x:ch.x,y:ch.y}}
  if(skel){const cx=skel.x+(skel.side?-1:1)*skel.u*.1,cy=skel.y-skel.u*.45;if(Math.hypot(x-cx,y-cy)<skel.u*.5*tol)return {k:'skel',o:skel,x:cx,y:skel.y-skel.u*.35}}
  if(stairs&&inQuad(x,y,stairs.q))return {k:'stairs',o:stairs,x:stairs.x,y:stairs.y};
  for(const e of eyes)if(e.a>.3&&Math.hypot(x-e.x,y-e.y)<e.sz*5)return {k:'eye',o:e,x:e.x,y:e.y};
  return null}
function inQuad(x,y,q){let ins=false;for(let i=0,j=3;i<4;j=i++){const [xi,yi]=q[i],[xj,yj]=q[j];if(((yi>y)!==(yj>y))&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins}return ins}
function labels(){if(busy)return;const h=hit(lx,ly,true);if(!h||h.k==='eye')return;const t=h.k==='chest'?'BAÚ ANTIGO · CLIQUE PARA ABRIR':h.k==='skel'?'RESTOS DE UM AVENTUREIRO':'ESCADA PARA BAIXO · CLIQUE PARA DESCER';
  c.font="700 12px Cinzel,serif";c.textAlign='center';const x=h.x,y=h.y-h.o.u*(h.k==='stairs'?.35:1.15);c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.85)';c.strokeText(t,x,y);c.fillStyle='#ffe6a6';c.fillText(t,x,y)}
const hT=$('#hT'),tb=$('#tb');
function hudTorch(T){let v,rd=false;if(T<boostTo)v=(boostTo-T)/4500;else if(T<coolTo)v=1-(coolTo-T)/7500;else{v=1;rd=true}const q=Math.round(v*50)/50;if(q!==lastBar){lastBar=q;hT.style.transform=`scaleX(${q})`}tb.classList.toggle('ready',rd)}
function updHud(){$('#hD').textContent='−'+depth;$('#hG').textContent=gold;$('#hC').textContent=chests.filter(c=>c.open).length+'/'+chests.length}
let logT=0;function say(t){const l=$('#log');l.textContent=t;l.classList.add('on');clearTimeout(logT);logT=setTimeout(()=>l.classList.remove('on'),4200)}

/* ================= LAÇO ================= */
function frame(T){now=T;
  lx+=(mx-lx)*.22;ly+=(my-ly)*.22;
  bE+=((T<boostTo?1:0)-bE)*.06;
  rad=(Math.min(W,H)*.3+Math.max(W,H)*.06)*(1+.05*Math.sin(T*.013)+.035*Math.sin(T*.031)+(R()-.5)*.03)*(1+.75*bE);
  // olhos
  for(const e of eyes){const d=Math.hypot(e.x-lx,e.y-ly);
    if(e.st==='in'){e.a=Math.min(1,e.a+.008);if(e.a>=1)e.st='watch';if(d<rad*.62)flee(e)}
    else if(e.st==='watch'){if(d<rad*.62)flee(e)}
    else if(e.st==='flee'){e.a-=.05;e.sz*=.97;e.y-=.3;if(e.a<=0){e.st='gone';e.t=T+3500+R()*5000}}
    else if(e.st==='gone'&&T>e.t)Object.assign(e,newEye())}
  // gotas
  for(const p of puddles)if(T>p.next){p.next=T+1400+R()*3200;const top=P(p.fx*W,0,p.s);drops.push({x:p.x+(R()-.5)*p.r*.3,y:top[1],vy:0,ty:p.y,s:p.s})}
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.vy+=.32*d.s+.05;d.y+=d.vy;if(d.y>=d.ty){drops.splice(i,1);ripples.push({x:d.x,y:d.ty,r:2,a:.8,s:d.s});const vol=clamp(1-Math.hypot(d.x-lx,d.ty-ly)/(W*.8),.15,1);FS.tone(1300+R()*900,.2,.03*vol,'sine',0,700+R()*300,.6);FS.tone(2600+R()*400,.05,.008*vol,'sine',.01,null,.5)}}
  // cena
  c.drawImage(scene,0,0,W,H);
  drawCage(T);
  [...chests.map(o=>['c',o]),['s',skel]].sort((a,b)=>a[1].y-b[1].y).forEach(([k,o])=>k==='c'?drawChest(o):drawSkel(o));
  c.fillStyle='rgba(190,215,240,.85)';for(const d of drops){c.beginPath();c.ellipse(d.x,d.y,1.4*d.s+.6,3*d.s+1.2,0,0,TAU);c.fill()}
  c.lineWidth=1;for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=.5+r.s*.8;r.a-=.014;if(r.a<=0){ripples.splice(i,1);continue}c.strokeStyle=`rgba(190,215,240,${r.a*.6})`;c.beginPath();c.ellipse(r.x,r.y,r.r,r.r*.28,0,0,TAU);c.stroke()}
  // escuridão recortada pelas luzes
  dx.globalCompositeOperation='source-over';dx.clearRect(0,0,W,H);dx.fillStyle='rgba(3,2,4,.968)';dx.fillRect(0,0,W,H);dx.globalCompositeOperation='destination-out';
  lightCut(lx,ly,rad,1);for(const L of lights)lightCut(L.x,L.y,L.r*(1+.1*Math.sin(T*L.f+L.p)),L.a);
  c.drawImage(dkc,0,0,W,H);
  c.globalCompositeOperation='lighter';tint(lx,ly,rad,'255,130,40',.2+bE*.06);for(const L of lights)tint(L.x,L.y,L.r,L.col,.13);c.globalCompositeOperation='source-over';
  drawEyes();labels();torch(lx,ly,T);
  if(R()<.22)FK.spark(lx+(R()-.5)*6,ly-18,1,.35);
  hudTorch(T);requestAnimationFrame(frame)}

/* ================= AÇÕES ================= */
function openChest(ch){ch.open=true;(opened[levelSeed]=opened[levelSeed]||[]).push(ch.id);
  const t0=performance.now();(function an(){ch.t=Math.min(1,(performance.now()-t0)/420);if(ch.t<1)requestAnimationFrame(an)})();
  lights.push(glowOf(ch));const n=(8+R()*30|0)*depth+5;gold+=n;updHud();
  FS.noise(.55,{v:.05,type:'bandpass',f0:420,f1:260,q:4,attack:.2,wet:.4});for(let i=0;i<9;i++)FS.coin(.026,.25+i*.06+R()*.03);setTimeout(()=>FS.arp(9,.025,.05),700);
  FK.burst(ch.x,ch.y-ch.u*.6,26,1.3,['#ffe6a6','#f5c65a','#fff6dc','#ffd27a']);
  FK.float('+'+n+' OURO',ch.x,ch.y-ch.u*1.3,{size:Math.max(22,Math.min(42,ch.u*.28))});
  const it=FK.rnd(LOOT);setTimeout(()=>FK.float(it,ch.x,ch.y-ch.u*.55,{size:Math.max(15,Math.min(24,ch.u*.15)),color:'#fff6dc',rot:0}),520);say('Você encontrou: '+it+'.');
  if(chests.every(c=>c.open))setTimeout(()=>say('Nada mais brilha aqui. A escada chama lá embaixo...'),2800)}
function rattle(sk){sk.rat=now+900;for(let i=0;i<12;i++)FS.tone(700+R()*900,.05,.02,'triangle',i*.05+R()*.02,300,.35);FS.noise(.5,{v:.03,type:'highpass',f0:3000,f1:1500});
  FK.float('CLAC-CLAC!',sk.x,sk.y-sk.u*.9,{size:Math.max(20,Math.min(40,sk.u*.22)),color:'#e8e0c8'});
  say(FK.rnd(['O esqueleto chacoalha... e volta a dormir.','Ele parece apontar para o fundo do salão.','“Não desça”, diria ele, se ainda tivesse língua.']))}
async function descend(){if(busy)return;busy=true;FS.whoosh(.8,.04);for(let i=0;i<6;i++)FS.drum(.09,i*.3);FS.noise(1.2,{v:.04,type:'lowpass',f0:600,f1:200,attack:.4,wet:.5});
  $('#fade').classList.add('on');await FK.sleep(950);depth++;levelSeed=(R()*1e9|0)+1;build();
  $('#lvlN').textContent='PROFUNDIDADE −'+depth;$('#lvlS').textContent=pal.n;$('#lvl').classList.add('on');await FK.sleep(600);$('#fade').classList.remove('on');FS.horn(110,1.8,.035);FS.bell(98,.04,.3);
  await FK.sleep(1900);$('#lvl').classList.remove('on');busy=false;say(FK.rnd(SAY))}
cv.addEventListener('pointerdown',e=>{mx=e.clientX;my=e.clientY;if(busy)return;const h=hit(mx,my,false);
  if(!h){FK.burst(mx,my-16,8,.6);FS.whoosh(.22,.03);return}
  if(h.k==='chest')openChest(h.o);else if(h.k==='skel')rattle(h.o);else if(h.k==='stairs')descend();else flee(h.o)});
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
addEventListener('keydown',e=>{if((e.key==='t'||e.key==='T')&&!e.repeat){if(now<coolTo){say('A tocha ainda está se recuperando...');return}
  boostTo=now+4500;coolTo=boostTo+7500;FS.fire(1.4,.2);FS.whoosh(.6,.06);FK.burst(lx,ly-16,30,1.6);say('A chama ruge e afasta as sombras!')}});

/* ================= SOM AMBIENTE ================= */
let amb=null;
function ambStart(){if(amb||!FS.ok())return;const a=FS.ctx(),w=FS.loopNoise('pink',.45);w.filter.type='bandpass';w.filter.Q.value=6;w.filter.frequency.value=420;w.gain.gain.setTargetAtTime(.05,a.currentTime,2);
  const d=FS.pad([55,82.41,110,130.81],.009,'triangle',.7);
  amb={w,d,iv:setInterval(()=>{w.filter.frequency.setTargetAtTime(260+R()*560,a.currentTime,1.8);w.gain.gain.setTargetAtTime(.02+R()*.07,a.currentTime,1.6)},2400)}}
function ambStop(){if(!amb)return;amb.w.stop();if(amb.d)amb.d.stop();clearInterval(amb.iv);amb=null}
document.addEventListener('fk-sound',e=>e.detail?ambStart():ambStop());
(function crk(){if(amb&&FS.ok())FS.noise(.02+R()*.03,{v:.01+R()*.022,type:'highpass',f0:1800+R()*2600,wet:.1});setTimeout(crk,50+R()*240)})();
function growl(){const a=FS.ctx(),t=a.currentTime,o=a.createOscillator(),lpf=a.createBiquadFilter(),g=a.createGain(),f=48+R()*20;o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*.8,t+1.8);lpf.type='lowpass';lpf.frequency.value=260;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.5);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(lpf).connect(g);FS.route(g,.8);o.start(t);o.stop(t+2.3);
  FS.noise(1.8,{v:.02,type:'bandpass',f0:300,f1:140,q:1.5,attack:.5,wet:.8});if(R()<.5&&!busy)say(FK.rnd(['Um rosnado distante faz o chão tremer.','Algo grande respira lá embaixo...']))}
(function gr(){if(amb&&FS.ok())growl();setTimeout(gr,9000+R()*14000)})();
setInterval(()=>{if(!busy&&!$('#log').classList.contains('on'))say(FK.rnd(SAY))},26000);

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr|0;cv.height=H*dpr|0;c.setTransform(dpr,0,0,dpr,0,0);dkc.width=Math.ceil(W*DS);dkc.height=Math.ceil(H*DS);dx.setTransform(DS,0,0,DS,0,0);build()}
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
FK.ready.then(()=>say('Você desce os degraus de pedra. A tocha é sua única amiga.'));
</script>
