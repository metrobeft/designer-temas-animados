 <ellipse class="ln" cx="203" cy="114" rx="7" ry="11" fill="#e6b08c"/>
 <path class="ln" d="M118 100 C118 70 138 58 160 58 C184 58 202 70 202 100 C202 136 186 160 160 162 C134 160 118 136 118 100Z" fill="url(#skin)"/>
 <path d="M124 130 C132 150 146 160 160 160 C176 160 190 150 196 130 C186 146 174 152 160 152 C146 152 134 146 124 130Z" fill="#6b4a33" opacity=".22"/>
 <ellipse cx="130" cy="128" rx="7" ry="3.5" fill="#e88f7a" opacity=".35"/><ellipse cx="190" cy="128" rx="7" ry="3.5" fill="#e88f7a" opacity=".35"/>
