<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
<title>Sir Aldric — cavaleiro humano de Valmor (personagem original do Tema Fantasia)</title>
<defs>
 <linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#5d6478"/><stop offset=".42" stop-color="#e8ecf4"/><stop offset=".58" stop-color="#aeb6c8"/><stop offset="1" stop-color="#4f566a"/></linearGradient>
 <linearGradient id="sv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f4f9"/><stop offset="1" stop-color="#78809a"/></linearGradient>
 <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c62c38"/><stop offset="1" stop-color="#560b15"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c0"/><stop offset=".5" stop-color="#e8b84a"/><stop offset="1" stop-color="#8f5f17"/></linearGradient>
 <linearGradient id="blade" x1="0" x2="1"><stop offset="0" stop-color="#8d96ab"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#7d869b"/></linearGradient>
 <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93623a"/><stop offset="1" stop-color="#4a2c16"/></linearGradient>
 <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3553a8"/><stop offset="1" stop-color="#15224d"/></linearGradient>
 <radialGradient id="skin" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#f8d8ba"/><stop offset="1" stop-color="#e2ab87"/></radialGradient>
 <clipPath id="bladeC"><path d="M222 312 L235 312 L233 438 L228.5 452 L224 438Z"/></clipPath>
 <path id="sun" d="M0 -22 L5 -9 L19 -13 L11 -2 L22 6 L8 8 L9 22 L0 12 L-9 22 L-8 8 L-22 6 L-11 -2 L-19 -13 L-5 -9Z"/>
</defs>
<style>
 .ln{stroke:#1b1209;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
 .body{animation:breath 3.4s ease-in-out infinite}
 @keyframes breath{50%{transform:translateY(-3px)}}
 .cape{transform-origin:160px 176px;animation:cape 4.2s ease-in-out infinite}
 @keyframes cape{50%{transform:rotate(1.8deg) skewX(-2.5deg)}}
 .eye{transform-box:fill-box;transform-origin:center;animation:bl 5.2s infinite}
 @keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
 .glint{animation:gl 3.6s ease-in-out infinite}
 @keyframes gl{0%,55%{transform:translateY(0);opacity:0}62%{opacity:1}100%{transform:translateY(140px);opacity:0}}
 .gem{animation:gem 2.4s ease-in-out infinite}
 @keyframes gem{50%{opacity:.5}}
 .lock{transform-origin:156px 62px;animation:lock 3.4s ease-in-out infinite}
 @keyframes lock{50%{transform:rotate(-6deg)}}
</style>
