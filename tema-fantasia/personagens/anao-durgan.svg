 <path class="ln" d="M104 172 Q160 158 216 172 L216 188 Q160 174 104 188Z" fill="url(#gold)"/>
 <circle cx="120" cy="178" r="2.4" fill="#5a3a10"/><circle cx="200" cy="178" r="2.4" fill="#5a3a10"/><circle cx="140" cy="173" r="2.4" fill="#5a3a10"/><circle cx="180" cy="173" r="2.4" fill="#5a3a10"/>
 <path class="ln" d="M154 178 L166 178 L164 206 L156 206Z" fill="url(#sv)" stroke-width="2.4"/>
</g>
<!-- brasas -->
