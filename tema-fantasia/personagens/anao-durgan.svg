<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480">
<title>Durgan Barba-de-Brasa — guerreiro anão de Durnhelm (personagem original do Tema Fantasia)</title>
<defs>
 <linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#5d6478"/><stop offset=".42" stop-color="#e8ecf4"/><stop offset=".58" stop-color="#aeb6c8"/><stop offset="1" stop-color="#4f566a"/></linearGradient>
 <linearGradient id="sv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f4f9"/><stop offset="1" stop-color="#78809a"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2c0"/><stop offset=".5" stop-color="#e8b84a"/><stop offset="1" stop-color="#8f5f17"/></linearGradient>
 <linearGradient id="lea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a32"/><stop offset="1" stop-color="#4a2c16"/></linearGradient>
 <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f08a3a"/><stop offset=".6" stop-color="#c9551f"/><stop offset="1" stop-color="#8e3412"/></linearGradient>
 <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>
 <radialGradient id="skin" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#f6c9a4"/><stop offset="1" stop-color="#d9946f"/></radialGradient>
 <radialGradient id="ember"><stop offset="0" stop-color="#fff0b0"/><stop offset=".4" stop-color="#ff9a3d" stop-opacity=".8"/><stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/></radialGradient>
 <pattern id="mail" width="8" height="6" patternUnits="userSpaceOnUse"><rect width="8" height="6" fill="#868da0"/><path d="M0 6 Q4 0 8 6" stroke="#454b5c" stroke-width="1.4" fill="none"/><path d="M-4 3 Q0 -3 4 3 M4 3 Q8 -3 12 3" stroke="#c9cfdb" stroke-width=".8" fill="none"/></pattern>
</defs>
<style>
 .ln{stroke:#1b1209;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
 .body{animation:breath 3s ease-in-out infinite}
 @keyframes breath{50%{transform:translateY(-3px) scaleX(1.004)}}
 .beard{transform-origin:160px 228px;animation:bd 3.4s ease-in-out infinite}
 @keyframes bd{50%{transform:rotate(1.6deg)}}
 .eye{transform-box:fill-box;transform-origin:center;animation:bl 4.4s infinite}
 @keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
 .rune{animation:rune 1.8s ease-in-out infinite}
 @keyframes rune{50%{opacity:.4}}
 .emb{animation:emb 3.6s linear infinite}
 @keyframes emb{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(-14px,-110px);opacity:0}}
</style>
<ellipse cx="160" cy="463" rx="112" ry="13" fill="#000" opacity=".38"/>
