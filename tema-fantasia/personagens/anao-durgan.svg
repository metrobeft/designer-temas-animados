 <g class="eye"><ellipse cx="181" cy="203" rx="5.5" ry="6.5" fill="#fff"/><circle cx="180" cy="204" r="3.8" fill="#5a3416"/><circle cx="179" cy="202.5" r="1.3" fill="#fff"/></g>
