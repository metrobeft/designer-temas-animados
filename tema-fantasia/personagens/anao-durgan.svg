  <path class="ln" d="M186 326 Q192 356 184 384" stroke="#b44a1a" stroke-width="12" fill="none"/>
  <rect class="ln" x="127" y="358" width="16" height="10" rx="3" fill="url(#gold)" stroke-width="2"/>
  <rect class="ln" x="179" y="358" width="16" height="10" rx="3" fill="url(#gold)" stroke-width="2"/>
  <rect class="ln" x="152" y="370" width="16" height="10" rx="3" fill="url(#gold)" stroke-width="2"/>
 </g>
 <path class="ln" d="M160 226 C150 220 130 224 118 246 C134 238 148 240 160 236 C172 240 186 238 202 246 C190 224 170 220 160 226Z" fill="#b8481a"/>
 <path d="M153 243 Q160 247 167 243" stroke="#5a1a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
