  <rect class="ln" x="222" y="120" width="10" height="38" rx="3" fill="url(#sv)" stroke-width="2.4"/>
  <rect class="ln" x="304" y="120" width="10" height="38" rx="3" fill="url(#sv)" stroke-width="2.4"/>
  <circle cx="268" cy="139" r="16" fill="url(#ember)" class="rune"/>
  <path d="M263 130 V148 M263 134 L271 139 L263 144" stroke="#ff8a2a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 </g>
