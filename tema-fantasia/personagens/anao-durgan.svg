 <ellipse class="ln" cx="113" cy="206" rx="7" ry="10" fill="url(#skin)"/>
 <ellipse class="ln" cx="207" cy="206" rx="7" ry="10" fill="url(#skin)"/>
 <path class="ln" d="M116 190 C116 172 136 166 160 166 C184 166 204 172 204 190 L204 226 C204 240 184 248 160 248 C136 248 116 240 116 226Z" fill="url(#skin)"/>
 <ellipse cx="128" cy="222" rx="9" ry="5" fill="#e8705a" opacity=".45"/><ellipse cx="192" cy="222" rx="9" ry="5" fill="#e8705a" opacity=".45"/>
 <!-- barba -->
 <g class="beard">
  <path class="ln" d="M112 210 C104 262 118 304 138 334 L148 362 L160 396 L172 362 L182 334 C202 304 216 262 208 210 C198 234 184 246 160 248 C136 246 122 234 112 210Z" fill="url(#beard)"/>
