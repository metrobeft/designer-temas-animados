 <path d="M72 322 Q78 344 98 350" stroke="url(#lea)" stroke-width="24" fill="none" stroke-linecap="round"/>
 <circle class="ln" cx="108" cy="352" r="13" fill="url(#skin)"/>
 <!-- martelo de guerra apoiado no ombro -->
 <path d="M214 396 L268 150" stroke="#1b1209" stroke-width="14" stroke-linecap="round"/>
 <path d="M214 396 L268 150" stroke="#6b4220" stroke-width="8" stroke-linecap="round"/>
 <path d="M226 342 L234 306" stroke="#2a1a0c" stroke-width="10"/>
