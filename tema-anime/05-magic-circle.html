<script>
/*AK_JS_BEGIN*/
/* ================= ANIME SOUND — tudo sintetizado com Web Audio ================= */
const AS=(()=>{
  const KEY='anime-sfx',R=Math.random;let ctx=null,master=null,on=true,fired=false,lastSpark=0;
  try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  const emit=v=>setTimeout(()=>document.dispatchEvent(new CustomEvent('ak-sound',{detail:v})),0);
  function ensure(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();const cp=ctx.createDynamicsCompressor();master=ctx.createGain();master.gain.value=.9;master.connect(cp).connect(ctx.destination)}catch(e){return null}}
    const go=()=>{if(on&&!fired&&ctx.state==='running'){fired=true;emit(true)}};if(ctx.state!=='running')ctx.resume().then(go).catch(()=>{});else go();return ctx}
  const ok=()=>on&&!!ctx&&ctx.state==='running';
  const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760,2093];
  const MIYAKO=[293.66,311.13,392,440,466.16,587.33,622.25,783.99,880,932.33,1174.66];
  function tone(f,d=.6,v=.05,type='sine',when=0,f2){if(!ok())return;const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
  function noise(d=.4,o={}){if(!ok())return;const v=o.v??.08,type=o.type||'bandpass',f0=o.f0||800,f1=o.f1||f0,q=o.q??1,when=o.when||0,at=o.attack??.01;const t=ctx.currentTime+when,b=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*d|0),ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+d+.05)}
  function loopNoise(color='pink'){if(!ok())return null;const len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);let l=0,b0=0,b1=0,b2=0;
    for(let i=0;i<len;i++){const w=R()*2-1;if(color==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else{b0=.99765*b0+w*.099046;b1=.963*b1+w*.2965164;b2=.57*b2+w*1.0526913;d[i]=(b0+b1+b2+w*.1848)*.18}}
    const s=ctx.createBufferSource();s.buffer=b;s.loop=true;const f=ctx.createBiquadFilter(),g=ctx.createGain();g.gain.value=0;s.connect(f).connect(g).connect(master);s.start();return {src:s,filter:f,gain:g,stop(){try{g.gain.setTargetAtTime(0,ctx.currentTime,.1);setTimeout(()=>s.stop(),400)}catch(e){}}}}
  const api={get on(){return on},ready:()=>!!ctx&&ctx.state==='running',ok,ensure,tone,noise,loopNoise,PENTA,MIYAKO,ctx:()=>ctx,out:()=>master,
    toggle(){on=!on;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}fired=false;if(on){ensure();setTimeout(()=>api.twinkle(),150)}else emit(false);document.querySelectorAll('.ak-snd').forEach(b=>b.textContent=on?'🔊 SOM':'🔇 SOM');return on},
    chime(i=0,when=0,v=.05){const f=PENTA[((i%PENTA.length)+PENTA.length)%PENTA.length];tone(f,1.2,v,'sine',when);tone(f*2,.45,v*.3,'triangle',when)},
    sparkle(){const n=performance.now();if(n-lastSpark<110)return;lastSpark=n;tone(PENTA[5+(R()*6|0)],.28,.01,'sine')},
    twinkle(v=.03){[0,2,4,7].forEach((k,i)=>api.chime(3+k,i*.055,v))},
    pop(v=.06){tone(950,.13,v,'sine',0,260)},
    whoosh(d=.5,v=.07){noise(d,{v,f0:300,f1:3800,q:1.2,attack:d*.45})},
    impact(v=.3){tone(150,.7,v,'sine',0,32);noise(.4,{v:v*.45,type:'lowpass',f0:2400,f1:150})},
    pluck(f,v=.06,when=0){tone(f,1.6,v,'triangle',when);tone(f*2.003,.4,v*.45,'sine',when);tone(f*3.01,.15,v*.22,'square',when)},
    jingle(){[2,4,6,9].forEach((k,i)=>api.chime(k,i*.1,.045));api.chime(7,.46,.04);api.chime(10,.46,.03)}
  };
  if(on)ensure();
  addEventListener('pointerdown',()=>{if(on)ensure()},true);
  addEventListener('keydown',e=>{if(on)ensure();if((e.key==='m'||e.key==='M')&&!e.repeat)api.toggle()},true);
  document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.ak-snd').forEach(b=>{b.textContent=on?'🔊 SOM':'🔇 SOM';b.addEventListener('click',e=>{e.stopPropagation();api.toggle()})});
    /* aviso: navegadores bloqueiam áudio até o 1º clique/tecla — some quando o som começa */
    const pill=document.createElement('div');pill.id='ak-unlock';pill.textContent='🔊 toque ou tecle para ativar o som ♪';
    const check=()=>{if(on&&!api.ready()){if(!pill.isConnected&&!document.getElementById('ak-gate'))document.body.appendChild(pill)}else pill.remove()};
    setTimeout(check,1200);setInterval(check,1200);addEventListener('pointerdown',()=>setTimeout(check,250),true);addEventListener('keydown',()=>setTimeout(check,250),true)});
  return api;
})();

/* ================= ANIME KIT — brilhos, onomatopeias, troca PT↔JP, eyecatch ================= */
const AK=(()=>{
  const KANA='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンあいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん☆♪♡';
  const R=Math.random,rnd=a=>a[R()*a.length|0],sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const morph=(el,final,dur=650)=>new Promise(res=>{const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/dur),n=Math.floor(final.length*k);let o='';for(let i=0;i<final.length;i++)o+=(i<n||final[i]===' ')?final[i]:rnd(KANA);el.textContent=o;if(k<1)requestAnimationFrame(f);else{el.textContent=final;res()}};requestAnimationFrame(f)});
  let cv,cx,W,H,parts=[],dirty=false;
  const COLS=['#ff7eb6','#a98bff','#ffe066','#7fe7ff','#ffffff'];
  function star(c,s){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?s*.3:s;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath()}
  function heart(c,s){c.beginPath();c.moveTo(0,s*.4);c.bezierCurveTo(s*.95,-s*.25,s*.5,-s*.95,0,-s*.4);c.bezierCurveTo(-s*.5,-s*.95,-s*.95,-s*.25,0,s*.4);c.closePath()}
  function spark(x,y,n=1,spd=1){for(let i=0;i<n;i++)parts.push({x,y,vx:(R()-.5)*2*spd,vy:(R()-.5)*2*spd-.4,life:1,dec:.014+R()*.02,s:4+R()*6,c:rnd(COLS),t:R()<.22?'h':'s',r:R()*6})}
  function burst(x,y,n=14,spd=1){for(let i=0;i<n;i++){const a=i/n*6.283+R()*.3,s=(2+R()*4)*spd;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dec:.018+R()*.015,s:5+R()*8,c:rnd(COLS),t:R()<.3?'h':'s',r:R()*6})}}
  function loop(){
    if(parts.length||dirty){cx.clearRect(0,0,W,H);dirty=parts.length>0}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.97;p.life-=p.dec;p.r+=.06;if(p.life<=0){parts.splice(i,1);continue}
      cx.save();cx.translate(p.x,p.y);if(p.t!=='h')cx.rotate(p.r);cx.globalAlpha=p.life;cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10;const s=p.s*(.4+p.life*.6);p.t==='h'?heart(cx,s):star(cx,s);cx.fill();cx.restore()}
    requestAnimationFrame(loop)}
  function fxInit(){cv=document.createElement('canvas');cv.id='ak-fx';document.body.appendChild(cv);cx=cv.getContext('2d');
    const rs=()=>{const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)};addEventListener('resize',rs);rs();
    let lx=0,ly=0;addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-lx,e.clientY-ly)>16){lx=e.clientX;ly=e.clientY;spark(lx,ly,1);AS.sparkle()}});
    addEventListener('pointerdown',e=>{burst(e.clientX,e.clientY,10);AS.twinkle(.016)});requestAnimationFrame(loop)}
  function sfx(text,x,y,o={}){const d=document.createElement('div');d.className='ak-sfx';d.textContent=text;d.style.left=x+'px';d.style.top=y+'px';d.style.setProperty('--r',(o.rot??(R()-.5)*26)+'deg');if(o.size)d.style.fontSize=o.size+'px';if(o.color)d.style.color=o.color;if(o.shadow)d.style.textShadow=`4px 4px 0 ${o.shadow}`;document.body.appendChild(d);setTimeout(()=>d.remove(),1500);if(o.snd&&AS[o.snd])AS[o.snd]()}
  function swap(el){if(el._ak)return;el._ak=1;const pt=el.textContent.trim(),jp=el.dataset.jp;
    (async()=>{await sleep(1800+R()*3000);while(el.isConnected){el.classList.remove('ak-pop');void el.offsetWidth;el.classList.add('ak-pop');const b=el.getBoundingClientRect();if(b.width)burst(b.left+b.width/2,b.top+b.height/2,8,.7);AS.pop(.025);AS.chime(5+(R()*4|0),.05,.02);await morph(el,jp);await sleep(1900+R()*1500);el.classList.remove('ak-pop');void el.offsetWidth;el.classList.add('ak-pop');await morph(el,pt);await sleep(3200+R()*4000)}})()}
  let readyRes;const ready=new Promise(r=>readyRes=r);
  function eyecatch(){const ov=document.getElementById('ak-eye');if(!ov)return Promise.resolve();let done=false,res;const p=new Promise(r=>res=r);
    const fin=()=>{if(done)return;done=true;AS.ensure();AS.whoosh(.5,.05);ov.classList.add('out');setTimeout(()=>{ov.remove();res()},720)};ov.addEventListener('click',fin);addEventListener('keydown',fin,{once:true});
    /* se o áudio estiver liberado, toca o jingle e fecha sozinho; se estiver bloqueado, espera um clique (até 6s) para já entrar com som */
    setTimeout(()=>{if(AS.ready()){AS.jingle();setTimeout(fin,1700)}else{const h=ov.querySelector('.ey-hint');if(h&&AS.on)h.textContent='🔊 CLIQUE PARA COMEÇAR COM SOM';setTimeout(fin,6000)}},250);return p}
  document.addEventListener('DOMContentLoaded',()=>{fxInit();document.querySelectorAll('[data-jp]').forEach(swap);eyecatch().then(readyRes)});
  return {R,rnd,sleep,morph,spark,burst,sfx,swap,ready,KANA};
})();
/*AK_JS_END*/

const cv=document.getElementById('cv'),c=cv.getContext('2d'),R=Math.random,TAU=Math.PI*2;
const EL=[
 {k:'火',n:'FOGO',c:'#ff6a3d',rgb:'255,106,61',jp:'炎よ、我が手に宿れ',pt:'chamas, habitem minhas mãos',f:0},
 {k:'水',n:'ÁGUA',c:'#4fb8ff',rgb:'79,184,255',jp:'水よ、すべてを癒やせ',pt:'água, cure todas as coisas',f:2},
 {k:'風',n:'VENTO',c:'#6dffb0',rgb:'109,255,176',jp:'風よ、翼となれ',pt:'vento, torne-se minhas asas',f:4},
 {k:'土',n:'TERRA',c:'#e0aa62',rgb:'224,170,98',jp:'大地よ、我を守れ',pt:'terra, proteja-me',f:1},
 {k:'光',n:'LUZ',c:'#ffe066',rgb:'255,224,102',jp:'星の光よ、我に力を',pt:'luz das estrelas, dê-me poder',f:5},
 {k:'闇',n:'TREVAS',c:'#b57cff',rgb:'181,124,255',jp:'闇よ、静寂をもたらせ',pt:'escuridão, traga o silêncio',f:3}
];
const RUNES='星の光よ我に力を・月の雫よ道を照らせ・風と炎と水と土・';
const RUNES2='ほしよつきよひかりのみちをてらせ・';
let W,H,dpr,CX,CY,R0,tilt=.6,tiltT=.6,el=4,rot=0,cast=0,holding=false,pillar=0,stars=[],motes=[],helix=[],rings=[],lastInput=performance.now();
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);CX=W/2;CY=H*.58;R0=Math.min(W*.36,H*.36);
  stars=Array.from({length:200},()=>({x:R()*W,y:R()*H,s:R()*1.6+.3,t:R()*TAU}));motes=Array.from({length:70},()=>({x:R()*W,y:R()*H,v:.2+R()*.6,s:1+R()*2.4}))}
document.getElementById('elems').innerHTML='<h4>ELEMENTOS · 属性</h4>'+EL.map((e,i)=>`<button style="--ec:${e.c}" data-i="${i}" title="tecla ${i+1}"><span class="ic">${e.k}</span><small>${i+1} · ${e.n}</small></button>`).join('');
function setEl(i,silent){el=i;const E=EL[i];document.documentElement.style.setProperty('--ecol',E.c);document.querySelectorAll('#elems button').forEach((b,k)=>b.classList.toggle('on',k===i));
  AK.morph(document.getElementById('chJp'),E.jp,700);document.getElementById('chPt').textContent=E.pt;if(!silent){AS.chime(E.f+3,0,.05);AS.chime(E.f+5,.08,.04);rings.push({r:.2,a:1})}}
document.querySelectorAll('#elems button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();setEl(+b.dataset.i)}));
function ring(r,w,a,dash){c.lineWidth=w;c.globalAlpha=a;if(dash)c.setLineDash(dash);c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();c.setLineDash([]);c.globalAlpha=1}
function poly(n,r,skip,a0){c.beginPath();for(let i=0;i<=n;i++){const a=a0+(i*skip%n)/n*TAU;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y)}c.stroke()}
function runeRing(txt,r,size,rr){c.font=`${size}px 'Dela Gothic One'`;c.textAlign='center';c.textBaseline='middle';const n=[...txt].length;[...txt].forEach((ch,i)=>{c.save();c.rotate(i/n*TAU+rr);c.translate(0,-r);c.fillText(ch,0,0);c.restore()})}
function drawCircle(T){
  const E=EL[el],k=1+cast*2.5;rot+=.0025*k;
  c.save();c.translate(CX,CY);c.scale(1,tilt);
  c.globalCompositeOperation='lighter';c.strokeStyle=E.c;c.fillStyle=E.c;c.shadowColor=E.c;c.shadowBlur=14+cast*20;
  const pulse=1+Math.sin(T*.004)*.01+cast*.03;c.scale(pulse,pulse);
  // anéis externos
  c.save();c.rotate(rot*.5);ring(R0,3,.9);ring(R0*.955,1.5,.8);for(let i=0;i<72;i++){c.save();c.rotate(i/72*TAU);c.globalAlpha=.8;c.fillRect(-1,-R0,2,i%6?6:14);c.restore()}c.globalAlpha=1;c.restore();
  c.save();c.rotate(-rot*.8);c.globalAlpha=.95;runeRing(RUNES,R0*.905,R0*.062,0);c.restore();
  c.save();c.rotate(rot*1.2);ring(R0*.85,2,.9);ring(R0*.83,1,.6,[4,8]);c.restore();
  // hexagrama + orbes
  c.save();c.rotate(-rot);c.lineWidth=2.4;c.globalAlpha=.9;poly(3,R0*.8,1,-Math.PI/2);poly(3,R0*.8,1,Math.PI/2);c.globalAlpha=1;
  EL.forEach((e,i)=>{const a=-Math.PI/2+i/6*TAU,x=Math.cos(a)*R0*.8,y=Math.sin(a)*R0*.8;c.save();c.translate(x,y);c.strokeStyle=e.c;c.shadowColor=e.c;c.fillStyle=i===el?e.c:'rgba(20,10,40,.6)';c.globalCompositeOperation='source-over';c.beginPath();c.arc(0,0,R0*.085*(i===el?1.25:1),0,TAU);c.fill();c.globalCompositeOperation='lighter';c.lineWidth=2;c.stroke();
    c.rotate(rot);c.fillStyle=i===el?'#140a22':'#fff';c.globalCompositeOperation='source-over';c.font=`${R0*.08}px 'Dela Gothic One'`;c.textAlign='center';c.textBaseline='middle';c.fillText(e.k,0,1);c.restore()});
  c.restore();c.globalCompositeOperation='lighter';c.strokeStyle=E.c;c.fillStyle=E.c;
  // círculo interno
  c.save();c.rotate(rot*2);ring(R0*.56,2,.9);c.globalAlpha=.85;runeRing(RUNES2,R0*.5,R0*.05,0);c.globalAlpha=1;ring(R0*.44,1.2,.8,[2,5]);c.restore();
  c.save();c.rotate(-rot*1.5);c.lineWidth=2;poly(5,R0*.4,2,-Math.PI/2);ring(R0*.12,2,1);c.restore();
  // núcleo
  const cg=c.createRadialGradient(0,0,0,0,0,R0*.35);cg.addColorStop(0,`rgba(255,255,255,${.6+cast*.4})`);cg.addColorStop(.3,`rgba(${E.rgb},${.35+cast*.4})`);cg.addColorStop(1,`rgba(${E.rgb},0)`);c.fillStyle=cg;c.shadowBlur=0;c.beginPath();c.arc(0,0,R0*.35,0,TAU);c.fill();
  // ondas ao trocar de elemento
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=.025;r.a-=.025;if(r.a<=0){rings.splice(i,1);continue}c.strokeStyle=`rgba(${E.rgb},${r.a})`;c.lineWidth=4*r.a;c.beginPath();c.arc(0,0,R0*r.r*1.6,0,TAU);c.stroke()}
  c.restore();c.globalCompositeOperation='source-over';c.shadowBlur=0;
}
function draw(T){
  const E=EL[el];tilt+=(tiltT-tilt)*.06;
  const g=c.createRadialGradient(CX,CY,0,CX,CY,Math.hypot(W,H)*.7);g.addColorStop(0,`rgba(${E.rgb},${.12+cast*.2})`);g.addColorStop(.4,'#130a33');g.addColorStop(1,'#05031a');c.fillStyle=g;c.fillRect(0,0,W,H);
  for(const s of stars){c.fillStyle=`rgba(255,255,255,${.25+.6*Math.abs(Math.sin(T*.001+s.t))})`;c.fillRect(s.x,s.y,s.s,s.s)}
  for(const m of motes){m.y-=m.v*(1+cast*4);m.x+=Math.sin(T*.001+m.y*.01)*.3;if(m.y<-10){m.y=H+10;m.x=R()*W}c.fillStyle=`rgba(${E.rgb},.55)`;c.beginPath();c.arc(m.x,m.y,m.s,0,TAU);c.fill()}
  // pilar de luz
  pillar+=((holding?cast:0)-pillar)*.08;
  if(pillar>.02){const pw=R0*(.3+pillar*.5);const pg=c.createLinearGradient(CX-pw,0,CX+pw,0);pg.addColorStop(0,`rgba(${E.rgb},0)`);pg.addColorStop(.5,`rgba(255,255,255,${pillar*.75})`);pg.addColorStop(1,`rgba(${E.rgb},0)`);c.fillStyle=pg;c.fillRect(CX-pw,0,pw*2,CY)}
  drawCircle(T);
  // hélice de partículas
  if(holding)for(let i=0;i<3+cast*6;i++)helix.push({a:R()*TAU,h:0,v:2+R()*3+cast*4,r:R0*(.2+R()*.7),s:2+R()*3});
  c.globalCompositeOperation='lighter';
  for(let i=helix.length-1;i>=0;i--){const p=helix[i];p.a+=.06;p.h+=p.v;p.r*=.995;if(p.h>CY+40){helix.splice(i,1);continue}const x=CX+Math.cos(p.a)*p.r,y=CY-p.h+Math.sin(p.a)*p.r*tilt;c.fillStyle=`rgba(${E.rgb},${1-p.h/(CY+40)})`;c.beginPath();c.arc(x,y,p.s,0,TAU);c.fill();c.fillStyle='rgba(255,255,255,.7)';c.fillRect(x-.8,y-.8,1.6,1.6)}
  c.globalCompositeOperation='source-over';
}
/* ===== conjuração ===== */
let cs=null;
function castStart(){if(holding)return;holding=true;lastInput=performance.now();document.getElementById('castT').textContent='CONJURANDO… 詠唱中';
  if(AS.ok()){const a=AS.ctx(),g=a.createGain();g.gain.value=0;g.connect(AS.out());const os=[0,4,7].map((s,i)=>{const o=a.createOscillator();o.type=i?'sine':'triangle';o.frequency.value=220*Math.pow(2,s/12);o.connect(g);o.start();return o});cs={g,os}}}
function castEnd(){if(!holding)return;holding=false;lastInput=performance.now();document.getElementById('castT').textContent='SEGURE PARA CONJURAR';if(cs){cs.g.gain.setTargetAtTime(0,AS.ctx().currentTime,.08);const x=cs;setTimeout(()=>x.os.forEach(o=>{try{o.stop()}catch(e){}}),500);cs=null}
  if(cast>=.98)henshin();}
function henshin(){const E=EL[el];const f=document.getElementById('flashM');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  AK.sfx('変身！',CX,CY-R0*.6,{size:Math.min(W*.16,150),shadow:E.c,rot:-6});setTimeout(()=>AK.sfx('キラキラ',CX+R0*.7,CY-R0*.2,{size:44,color:'#fff',shadow:E.c}),250);
  for(let i=0;i<5;i++)setTimeout(()=>AK.burst(CX+(R()-.5)*R0*1.4,CY-R()*R0,22,1.6),i*120);for(let i=0;i<6;i++)rings.push({r:.1+i*.05,a:1});
  if(AS.ok()){const a=AS.ctx(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(2400,t+.6);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+.8);o.connect(g).connect(AS.out());o.start(t);o.stop(t+.85);
    [0,4,7,11,14].forEach((s,i)=>AS.tone(523.25*Math.pow(2,s/12),2.6,.05,'sine',.55+i*.06));AS.twinkle(.05);AS.impact(.12)}
  cast=0}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);castStart()});cv.addEventListener('pointerup',castEnd);cv.addEventListener('pointercancel',castEnd);
addEventListener('pointermove',e=>{tiltT=.28+.72*Math.max(0,Math.min(1,1-e.clientY/H))});
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();castStart()}const n=+e.key;if(n>=1&&n<=6)setEl(n-1)});
addEventListener('keyup',e=>{if(e.code==='Space')castEnd()});
let lastCh=0;
function loop(T){
  if(!holding&&performance.now()-lastInput>7000){castStart();autoCast=true}
  if(holding){cast=Math.min(1,cast+.006);if(cs){const t=AS.ctx().currentTime;cs.g.gain.setTargetAtTime(.02+cast*.05,t,.1);cs.os.forEach((o,i)=>o.frequency.setTargetAtTime(220*Math.pow(2,[0,4,7][i]/12)*(1+cast),t,.1))}
    if(T-lastCh>420-cast*250){lastCh=T;AS.chime(EL[el].f+(R()*5|0),0,.02+cast*.02)}
    if(autoCast&&cast>=1){autoCast=false;castEnd()}}
  else cast=Math.max(0,cast-.02);
  document.getElementById('castBar').style.width=(cast*100)+'%';
  draw(T);requestAnimationFrame(loop)}
let autoCast=false;
/* ambiente: pad suave com tremolo */
let pad=null;
function padStart(){if(pad||!AS.ok())return;const a=AS.ctx(),g=a.createGain(),lfo=a.createOscillator(),lg=a.createGain();g.gain.value=.012;lfo.frequency.value=.25;lg.gain.value=.006;lfo.connect(lg).connect(g.gain);lfo.start();g.connect(AS.out());
  const os=[146.83,220,293.66,369.99].map((f,i)=>{const o=a.createOscillator();o.type='sine';o.frequency.value=f*(1+(i%2?.003:-.003));o.connect(g);o.start();return o});pad={g,os,lfo}}
document.addEventListener('ak-sound',e=>{if(e.detail)padStart();else if(pad){pad.os.forEach(o=>o.stop());pad.lfo.stop();pad=null}});
addEventListener('resize',resize);resize();setEl(4,true);requestAnimationFrame(loop);
</script>
