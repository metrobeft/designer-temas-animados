<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMA ANIME — em breve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--p:#ff7eb6;--v:#a98bff;--bg:#1a0b2e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:'M PLUS Rounded 1c',sans-serif}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
.burst{position:fixed;left:50%;top:50%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0deg 2deg,transparent 2deg 9deg);mask-image:radial-gradient(circle,transparent 12%,#000 40%,transparent 70%);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;z-index:2;padding:20px}
.jp{font-size:clamp(14px,2vw,22px);letter-spacing:.6em;color:var(--p);text-shadow:0 0 12px var(--p)}
h1{font-weight:800;font-size:clamp(44px,10vw,150px);line-height:1;letter-spacing:.02em;color:#fff;text-shadow:4px 4px 0 var(--v),8px 8px 0 rgba(255,126,182,.6),0 0 40px rgba(255,126,182,.7);animation:pop 2.6s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.04) rotate(1deg)}}
.badge{display:inline-block;margin-top:6px;font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.35em;padding:8px 16px;border:2px solid #fff;background:var(--p);color:#1a0b2e;box-shadow:5px 5px 0 var(--v);transform:rotate(-2deg)}
p{max-width:560px;font-size:15px;line-height:1.7;color:#fff;background:rgba(26,11,46,.55);padding:12px 18px;border-radius:10px;backdrop-filter:blur(3px)}
.nav{position:fixed;bottom:16px;left:16px;z-index:3;display:flex;gap:8px;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.15em}
.nav a{color:#fff;text-decoration:none;border:2px solid #fff;padding:7px 12px;background:rgba(26,11,46,.6);box-shadow:3px 3px 0 var(--p)}
.nav a:hover{background:var(--p);color:#1a0b2e}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="burst"></div>
<div class="center">
  <div class="jp">近日公開 · アニメ テーマ</div>
  <h1>TEMA ANIME</h1>
  <span class="badge">EM CONSTRUÇÃO</span>
  <p>Esta pasta é o próximo tema do projeto. Aqui vão entrar páginas com pétalas de sakura, linhas de velocidade, painéis de mangá e efeitos de anime, seguindo o mesmo padrão do tema hacker.</p>
</div>
<nav class="nav"><a href="../index.html">⌂ INÍCIO</a><a href="../tema-hacker/index.html">TEMA HACKER ▸</a></nav>
<script>
const cv=document.getElementById('sky'),c=cv.getContext('2d'),R=Math.random,DPR=Math.min(devicePixelRatio||1,2);
let W,H,petals=[],stars=[];
function np(init){return {x:R()*W*1.2-W*.1,y:init?R()*H:-20,s:7+R()*12,vy:.5+R()*1.1,vx:.4+R()*.9,r:R()*6.28,vr:(R()-.5)*.05,sw:R()*6.28,a:.55+R()*.45}}
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;c.setTransform(DPR,0,0,DPR,0,0);petals=Array.from({length:110},()=>np(true));stars=Array.from({length:120},()=>({x:R()*W,y:R()*H*.6,s:R()*1.6,t:R()*6}))}
function petal(s){c.beginPath();c.moveTo(0,-s);c.bezierCurveTo(s*.9,-s*.6,s*.7,s*.6,0,s);c.bezierCurveTo(-s*.7,s*.6,-s*.9,-s*.6,0,-s);c.closePath()}
function draw(t){
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#120626');g.addColorStop(.55,'#3b1650');g.addColorStop(1,'#ff7eb6');c.fillStyle=g;c.fillRect(0,0,W,H);
  for(const s of stars){c.fillStyle=`rgba(255,255,255,${.3+.5*Math.abs(Math.sin(t*.001+s.t))})`;c.fillRect(s.x,s.y,s.s,s.s)}
  const mx=W*.5,my=H*.62,mr=Math.min(W,H)*.3;const mg=c.createRadialGradient(mx,my,0,mx,my,mr);mg.addColorStop(0,'rgba(255,235,245,.9)');mg.addColorStop(.4,'rgba(255,150,200,.4)');mg.addColorStop(1,'rgba(255,126,182,0)');c.fillStyle=mg;c.beginPath();c.arc(mx,my,mr,0,6.29);c.fill();
  for(const p of petals){p.sw+=.03;p.y+=p.vy;p.x+=p.vx+Math.sin(p.sw)*.7;p.r+=p.vr;if(p.y>H+20||p.x>W+20)Object.assign(p,np(false));
    c.save();c.translate(p.x,p.y);c.rotate(p.r);c.scale(1,.55+Math.sin(p.sw)*.35);c.fillStyle=`rgba(255,${180+(p.s*3|0)},${215+(p.s*2|0)},${p.a})`;petal(p.s);c.fill();c.restore()}
  requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();requestAnimationFrame(draw);
</script>
</body>
</html>
