<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMA ANIME — Abertura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&family=Bangers&display=swap" rel="stylesheet">
<style>
/*AK_CSS_BEGIN*/
/* ===== ANIME KIT ===== */
:root{--p:#ff7eb6;--v:#a98bff;--y:#ffe066;--c:#7fe7ff;--n:#1a0b2e;--w:#fff7fb;--ink:#140a22}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--n);color:var(--w);font-family:'M PLUS Rounded 1c',sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ak-jp{display:inline-block}
.ak-pop{animation:akPop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes akPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-3deg)}100%{transform:scale(1)}}
#ak-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:180}
.ak-sfx{position:fixed;z-index:170;pointer-events:none;font-family:'Dela Gothic One',sans-serif;font-size:56px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--p);animation:akSfx 1.4s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap}
@keyframes akSfx{0%{transform:translate(-50%,-50%) scale(.2) rotate(var(--r,0deg));opacity:0}20%{transform:translate(-50%,-50%) scale(1.15) rotate(var(--r,0deg));opacity:1}35%{transform:translate(-50%,-50%) scale(1) rotate(var(--r,0deg))}80%{opacity:1}100%{transform:translate(-50%,-62%) scale(1.05) rotate(var(--r,0deg));opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes flk{50%{opacity:.25}}
@keyframes bob{50%{transform:translateY(-4px)}}
.ak-title{font-family:'Dela Gothic One',sans-serif;font-weight:400;color:#fff;text-shadow:3px 3px 0 var(--p),6px 6px 0 var(--v),0 0 30px rgba(255,126,182,.45)}
.ak-nav{position:fixed;bottom:14px;left:14px;z-index:160;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;letter-spacing:.06em}
.ak-nav a,.ak-nav span,.ak-nav button{color:#fff;text-decoration:none;border:2px solid #fff;border-radius:999px;padding:6px 13px;background:rgba(26,11,46,.6);box-shadow:3px 3px 0 var(--p);backdrop-filter:blur(4px);transition:transform .2s,box-shadow .2s;font-size:12px;font-weight:800}
.ak-nav a:hover,.ak-nav button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--p);background:var(--p);color:var(--ink)}
.ak-nav span{box-shadow:3px 3px 0 var(--v)}
#ak-eye{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--p);overflow:hidden;cursor:pointer;clip-path:polygon(0 0,130% 0,100% 100%,-30% 100%)}
#ak-eye::before{content:'';position:absolute;inset:-60%;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 40px,transparent 40px 80px);animation:eyeSl 1s linear infinite}
@keyframes eyeSl{to{transform:translateX(113px)}}
#ak-eye::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,transparent 35%,rgba(26,11,46,.35))}
.ey-card{position:relative;z-index:2;text-align:center;background:#fff;color:var(--ink);padding:24px 54px 26px;border:4px solid var(--ink);border-radius:26px;box-shadow:10px 10px 0 var(--v);transform:rotate(-3deg);animation:eyeIn .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes eyeIn{from{transform:scale(0) rotate(-25deg)}}
.ey-ep{font-family:'Dela Gothic One',sans-serif;font-size:20px;color:var(--p);letter-spacing:.3em}
.ey-title{font-family:'Dela Gothic One',sans-serif;font-size:clamp(28px,5vw,58px);line-height:1.1;margin:8px 0}
.ey-sub{font-weight:800;font-size:15px;letter-spacing:.5em;color:var(--v)}
.ey-hint{position:absolute;bottom:8vh;left:0;right:0;text-align:center;z-index:2;font-weight:800;font-size:11px;letter-spacing:.3em;color:#fff;opacity:.8}
#ak-eye.out{animation:eyeOut .7s cubic-bezier(.7,0,.3,1) forwards;pointer-events:none}
@keyframes eyeOut{to{clip-path:polygon(130% 0,130% 0,100% 100%,100% 100%)}}
.ak-hint{position:fixed;right:16px;bottom:16px;z-index:150;font-size:11px;font-weight:800;letter-spacing:.14em;color:#fff;opacity:.75;text-align:right;text-shadow:0 1px 6px rgba(0,0,0,.6)}
@media (max-width:760px){.ak-hint{display:none}}
#ak-unlock{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:260;background:#fff;color:var(--ink);font-weight:800;font-size:13px;letter-spacing:.06em;padding:10px 18px;border:3px solid var(--ink);border-radius:999px;box-shadow:5px 5px 0 var(--p);cursor:pointer;animation:akU 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes akU{50%{transform:translate(-50%,-5px)}}
/*AK_CSS_END*/
/* ===== CÉU / CAMADAS ===== */
#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:44;opacity:0;transition:opacity .15s}
#lines.on{opacity:1}
#flash{position:fixed;inset:0;z-index:95;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#wipe{position:fixed;inset:0;z-index:96;pointer-events:none;background:var(--p);clip-path:polygon(-40% 0,-40% 0,-60% 100%,-60% 100%)}
#wipe::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 36px,transparent 36px 72px)}
#wipe.go{animation:wp .9s cubic-bezier(.7,0,.3,1)}
@keyframes wp{0%{clip-path:polygon(-40% 0,-40% 0,-60% 100%,-60% 100%)}45%,55%{clip-path:polygon(-40% 0,140% 0,120% 100%,-60% 100%)}100%{clip-path:polygon(140% 0,140% 0,120% 100%,120% 100%)}}

/* ===== INTRO ===== */
#intro{position:fixed;inset:0;z-index:40}
#intro.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:none}15%{transform:translate(-16px,8px) rotate(-1deg)}30%{transform:translate(14px,-10px)}45%{transform:translate(-10px,6px) rotate(1deg)}60%{transform:translate(8px,-4px)}80%{transform:translate(-3px,2px)}}
.lb{position:fixed;left:0;right:0;height:9vh;background:#0a0414;z-index:70;transition:transform 1.1s cubic-bezier(.7,0,.2,1);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;font-size:12px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.65)}
.lb.t{top:0}.lb.b{bottom:0}
body.hub .lb.t{transform:translateY(-100%)}body.hub .lb.b{transform:translateY(100%)}
.op{color:var(--p)}.op i{display:inline-block;margin-right:8px;animation:spin 2s linear infinite}
#scrub{flex:1;height:4px;margin:0 3vw;background:rgba(255,255,255,.12);border-radius:4px;position:relative}
#scrub i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--v))}
#scrub i::after{content:'🌸';position:absolute;right:-9px;top:-9px;font-size:16px}
.ctrl{display:flex;gap:8px}
.ctrl button{border:2px solid #fff;border-radius:999px;padding:6px 13px;font-size:11px;font-weight:800;letter-spacing:.12em;color:#fff;background:rgba(255,255,255,.06)}
.ctrl button:hover{background:var(--p);color:var(--ink);border-color:var(--p)}

.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s}
.scene.on{opacity:1}
.petal-cap{position:absolute;left:50%;top:70%;transform:translateX(-50%);font-weight:800;letter-spacing:.6em;font-size:13px;color:rgba(255,255,255,.6)}
.big-kanji{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) scale(.75);font-family:'Dela Gothic One',sans-serif;font-size:min(62vh,52vw);line-height:1;color:rgba(255,255,255,.5);text-shadow:0 0 80px rgba(255,126,182,.9);transition:transform 3.2s cubic-bezier(.2,.8,.2,1)}
#s1.on .big-kanji{transform:translate(-50%,-50%) scale(1)}
.credits{position:absolute;left:7vw;bottom:15vh;font-size:clamp(13px,1.3vw,17px);line-height:2.1;color:#fff;text-shadow:0 2px 10px rgba(90,20,90,.7)}
.credits div{opacity:0;transform:translateX(-24px);transition:.6s cubic-bezier(.2,1.2,.4,1)}
.credits div.on{opacity:1;transform:none}
.credits b{font-family:'Dela Gothic One',sans-serif;font-weight:400;display:inline-block;min-width:5.5em;color:var(--y);text-shadow:2px 2px 0 var(--ink)}
.title-jp-v{position:absolute;right:8vw;top:16vh;writing-mode:vertical-rl;font-family:'Dela Gothic One',sans-serif;font-size:clamp(22px,3vw,40px);letter-spacing:.3em;color:#fff;text-shadow:3px 3px 0 var(--p)}
.cut{position:absolute;top:0;bottom:0;width:42%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:var(--tf);transition:transform .45s cubic-bezier(.2,1.25,.4,1);clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);overflow:hidden}
.cut.on{transform:none}
.cut::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.35) 1.5px,transparent 2px) 0 0/12px 12px;mix-blend-mode:overlay}
.c1{left:-6%;background:linear-gradient(160deg,#ff9ac6,#ff4f8b);--tf:translateX(-130%)}
.c2{left:29%;background:linear-gradient(160deg,#c3a8ff,#6a4fd8);--tf:translateY(115%)}
.c3{left:64%;background:linear-gradient(160deg,#ffe98a,#ffb13b);--tf:translateX(130%)}
.cut .k{position:relative;font-family:'Dela Gothic One',sans-serif;font-size:min(24vh,17vw);line-height:1;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:8px 8px 0 rgba(20,10,34,.35)}
.cut .w{position:relative;font-family:Bangers,cursive;font-size:clamp(22px,3vw,44px);letter-spacing:.2em;color:var(--ink);margin-top:10px}
#s3{display:flex;flex-direction:column;align-items:center;justify-content:center}
.lg-top{font-family:Bangers,cursive;font-size:clamp(22px,3vw,42px);letter-spacing:.55em;color:var(--y);text-shadow:3px 3px 0 var(--ink);opacity:0;transform:translateY(-20px);transition:.6s}
#s3.on .lg-top{opacity:1;transform:none}
.lg-main{position:relative;display:flex;font-family:'Dela Gothic One',sans-serif;font-size:clamp(64px,16vw,250px);line-height:1.05;overflow:hidden;padding:0 .1em}
.lg-main span{display:inline-block;color:#fff;-webkit-text-stroke:.05em var(--ink);paint-order:stroke fill;text-shadow:.04em .04em 0 var(--p),.08em .08em 0 var(--v);transform:scale(0) rotate(-40deg);transition:transform .55s cubic-bezier(.3,1.9,.5,1)}
.lg-main span.on{transform:rotate(var(--rot,0deg))}
.lg-main::after{content:'';position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);mix-blend-mode:overlay}
.lg-main.shine::after{animation:shine 1.1s ease-in-out}
@keyframes shine{to{left:130%}}
.lg-jp{margin-top:6px;font-family:'Dela Gothic One',sans-serif;font-size:clamp(18px,2.6vw,36px);color:var(--ink);background:var(--y);padding:6px 24px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--p);transform:rotate(-4deg) scale(0);transition:transform .5s cubic-bezier(.3,1.9,.5,1)}
.lg-jp.on{transform:rotate(-4deg) scale(1)}
.lg-sub{margin-top:26px;font-weight:800;letter-spacing:.42em;font-size:clamp(12px,1.4vw,17px);min-height:1.5em;text-shadow:0 2px 10px rgba(0,0,0,.5)}

/* ===== HUB ===== */
#hub{position:fixed;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;transition:opacity .9s .2s}
body.hub #hub{opacity:1;pointer-events:auto}
#hub::-webkit-scrollbar{width:8px}#hub::-webkit-scrollbar-thumb{background:var(--p);border-radius:8px}
.hb{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 4vw;background:linear-gradient(to bottom,rgba(13,6,36,.92),rgba(13,6,36,.55));backdrop-filter:blur(6px);border-bottom:2px solid rgba(255,126,182,.25)}
.logo{font-family:'Dela Gothic One',sans-serif;font-size:clamp(20px,2.4vw,32px);color:#fff;text-shadow:3px 3px 0 var(--p),6px 6px 0 var(--v);line-height:1}
.logo small{display:block;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;font-size:11px;letter-spacing:.4em;color:var(--p);text-shadow:none;margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:2px solid rgba(255,255,255,.8);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800;letter-spacing:.06em;background:rgba(26,11,46,.5);color:#fff;text-decoration:none}
.chip.p{background:var(--p);color:var(--ink);border-color:var(--p)}
a.chip:hover,button.chip:hover{background:#fff;color:var(--ink)}
.hero{padding:42px 4vw 6px}
.hero h2{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:clamp(26px,4vw,58px);color:#fff;text-shadow:4px 4px 0 var(--p),8px 8px 0 rgba(169,139,255,.7)}
.hero p{margin-top:14px;font-size:15px;font-weight:500;color:#ffd9ea;min-height:1.5em;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;padding:30px 4vw 110px}
.card{--cc:var(--p);position:relative;display:flex;flex-direction:column;text-decoration:none;color:#fff;background:linear-gradient(170deg,rgba(255,255,255,.1),rgba(26,11,46,.85) 55%);border:3px solid #fff;border-radius:22px;overflow:hidden;box-shadow:7px 7px 0 var(--cc);opacity:0;transform:translateY(50px) rotate(2deg);transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
body.hub .card{animation:cardIn .8s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(var(--i)*100ms + .5s)}
@keyframes cardIn{to{opacity:1;transform:none}}
.card:hover{transform:translate(-4px,-6px) rotate(-1deg)!important;box-shadow:13px 13px 0 var(--cc)}
.thumb{position:relative;height:150px;background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 45%,#1a0b2e),#1a0b2e);border-bottom:3px solid #fff;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.badge{position:absolute;top:10px;left:10px;font-family:'Dela Gothic One',sans-serif;font-size:13px;color:var(--ink);background:var(--cc);border:2px solid var(--ink);border-radius:8px;padding:3px 9px;transform:rotate(-4deg);box-shadow:3px 3px 0 var(--ink)}
.epn{position:absolute;top:12px;right:12px;font-family:Bangers,cursive;font-size:20px;letter-spacing:.1em;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-family:'Dela Gothic One',sans-serif;font-weight:400;font-size:22px;line-height:1.15;color:#fff;text-shadow:2px 2px 0 var(--cc)}
.card .jp{font-weight:800;font-size:13px;letter-spacing:.35em;color:var(--cc)}
.card p{font-size:13px;line-height:1.6;color:#f2e6ff;opacity:.9}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.tags span{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 9px;border-radius:999px;border:2px solid color-mix(in srgb,var(--cc) 70%,transparent);color:#fff}
.watch{position:absolute;right:16px;bottom:16px;font-family:Bangers,cursive;font-size:18px;letter-spacing:.12em;color:var(--cc);opacity:0;transform:translateX(-10px);transition:.3s}
.card:hover .watch{opacity:1;transform:none}
.ticker{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:35;background:var(--p);color:var(--ink);border-top:3px solid var(--ink);overflow:hidden;font-weight:800;font-size:13px;line-height:31px;letter-spacing:.08em;opacity:0;transition:opacity 1s 1s}
body.hub .ticker{opacity:1}
.ticker div{display:inline-block;white-space:nowrap;padding-left:100%;animation:tk 55s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
/* animações das miniaturas */
.fall{animation:fall 3s linear infinite}
@keyframes fall{from{transform:translate(0,-20px) rotate(0)}to{transform:translate(-40px,120px) rotate(320deg)}}
.flk{animation:flk 1.2s steps(2) infinite}
@keyframes flk{50%{opacity:.25}}
.rot{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.rotr{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite reverse}
.bob{animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.popb{transform-box:fill-box;transform-origin:center;animation:popb 2s cubic-bezier(.3,1.8,.5,1) infinite}
@keyframes popb{0%,15%{transform:scale(0)}35%,85%{transform:scale(1)}100%{transform:scale(0)}}
.rain{animation:rn .6s linear infinite}
@keyframes rn{to{transform:translate(-6px,18px)}}
.shoot{animation:sh 2.6s ease-in infinite}
@keyframes sh{0%{transform:translate(0,0);opacity:0}10%{opacity:1}60%,100%{transform:translate(-110px,60px);opacity:0}}
.steam{animation:stm 2.4s ease-in-out infinite}
@keyframes stm{0%{transform:translateY(4px);opacity:0}50%{opacity:.9}100%{transform:translateY(-10px);opacity:0}}
.eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}

/* ===== MASCOTE HANA (personagem original) ===== */
.idol{width:100%;height:100%;overflow:visible;display:block}
.idol .bodyg{animation:bob 2.4s ease-in-out infinite}
.idol .eye{transform-box:fill-box;transform-origin:center;animation:blinkE 4.6s infinite}
@keyframes blinkE{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.idol .wave{transform-box:view-box;transform-origin:152px 204px;animation:wave .9s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.idol .bunl{transform-box:fill-box;transform-origin:right bottom;animation:bun 2.4s ease-in-out infinite}
.idol .bunr{transform-box:fill-box;transform-origin:left bottom;animation:bun 2.4s ease-in-out infinite reverse}
@keyframes bun{50%{transform:rotate(-6deg)}}
.idol .note{animation:note 3s linear infinite;font-family:'Dela Gothic One',sans-serif}
@keyframes note{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(26px,-90px);opacity:0}}
.idol .cup{animation:flk 1.4s steps(2) infinite}
#idolIntro{position:absolute;right:4vw;bottom:10vh;width:min(24vw,290px);aspect-ratio:220/300;transform:translateY(130%) rotate(12deg);transition:transform .9s cubic-bezier(.3,1.6,.5,1)}
#idolIntro.on{transform:none}
.bubble{position:absolute;left:-46%;top:6%;background:#fff;color:var(--ink);font-weight:800;font-size:clamp(12px,1.2vw,16px);padding:10px 16px;border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--p);white-space:nowrap;transform:scale(0) rotate(-6deg);transform-origin:right bottom;transition:transform .45s cubic-bezier(.3,1.9,.5,1) .5s}
.bubble::after{content:'';position:absolute;right:-14px;bottom:10px;border:9px solid transparent;border-left:16px solid var(--ink)}
.on>.bubble,.hero .bubble{transform:scale(1) rotate(-6deg)}
.hero{display:flex;align-items:center;gap:30px}
.hero .txt{flex:1;min-width:0}
.idolBox{position:relative;width:min(210px,26vw);aspect-ratio:220/300;flex-shrink:0;margin-right:2vw}
.idolBox .bubble{left:-70%;top:2%}
.idol-name{position:absolute;bottom:-6px;right:0;font-family:Bangers,cursive;font-size:15px;letter-spacing:.15em;color:var(--y);text-shadow:2px 2px 0 var(--ink)}
@media (max-width:760px){#idolIntro,.idolBox{display:none}}
/* ===== MASCOTE PERSONALIZADA (imagem do usuário) ===== */
.idol-img{width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(5px 5px 0 rgba(20,10,34,.45)) drop-shadow(0 0 24px rgba(255,126,182,.25));animation:bob 2.4s ease-in-out infinite}
.idol-credit{position:absolute;left:-40%;right:-6%;bottom:-34px;text-align:right;font-size:9.5px;font-weight:500;letter-spacing:.03em;line-height:1.35;color:rgba(255,255,255,.65)}

@media (max-width:700px){.title-jp-v{display:none}.lb{font-size:9px;letter-spacing:.08em}.cut .k{font-size:15vw}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="lines"></canvas>

<div id="intro">
  <div class="scene" id="s0"><div class="petal-cap">♪ OPENING</div></div>
  <div class="scene" id="s1">
    <div class="big-kanji">春</div>
    <div class="title-jp-v">デザイナー・アニメ</div>
    <div class="credits" id="credits">
      <div><b>原作</b>imaginação</div>
      <div><b>構成</b>HTML</div>
      <div><b>色彩</b>CSS</div>
      <div><b>魔法</b>JavaScript</div>
    </div>
  </div>
  <div class="scene" id="s2">
    <div class="cut c1"><div class="k">夢</div><div class="w">SONHO</div></div>
