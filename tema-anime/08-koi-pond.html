/*AK_CSS_BEGIN*/
/* ===== ANIME KIT ===== */
:root{--p:#ff7eb6;--v:#a98bff;--y:#ffe066;--c:#7fe7ff;--n:#1a0b2e;--w:#fff7fb;--ink:#140a22}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--n);color:var(--w);font-family:'M PLUS Rounded 1c',sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ak-jp{display:inline-block}
.ak-pop{animation:akPop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes akPop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-3deg)}100%{transform:scale(1)}}
#ak-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:180}
.ak-sfx{position:fixed;z-index:170;pointer-events:none;font-family:'Dela Gothic One',sans-serif;font-size:56px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--p);animation:akSfx 1.4s cubic-bezier(.2,1.4,.4,1) forwards;white-space:nowrap}
@keyframes akSfx{0%{transform:translate(-50%,-50%) scale(.2) rotate(var(--r,0deg));opacity:0}20%{transform:translate(-50%,-50%) scale(1.15) rotate(var(--r,0deg));opacity:1}35%{transform:translate(-50%,-50%) scale(1) rotate(var(--r,0deg))}80%{opacity:1}100%{transform:translate(-50%,-62%) scale(1.05) rotate(var(--r,0deg));opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes flk{50%{opacity:.25}}
@keyframes bob{50%{transform:translateY(-4px)}}
.ak-title{font-family:'Dela Gothic One',sans-serif;font-weight:400;color:#fff;text-shadow:3px 3px 0 var(--p),6px 6px 0 var(--v),0 0 30px rgba(255,126,182,.45)}
.ak-nav{position:fixed;bottom:14px;left:14px;z-index:160;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;letter-spacing:.06em}

.ak-nav a:hover,.ak-nav button:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--p);background:var(--p);color:var(--ink)}
.ak-nav span{box-shadow:3px 3px 0 var(--v)}
#ak-eye{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--p);overflow:hidden;cursor:pointer;clip-path:polygon(0 0,130% 0,100% 100%,-30% 100%)}
#ak-eye::before{content:'';position:absolute;inset:-60%;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 40px,transparent 40px 80px);animation:eyeSl 1s linear infinite}
@keyframes eyeSl{to{transform:translateX(113px)}}
#ak-eye::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,transparent 35%,rgba(26,11,46,.35))}
.ey-card{position:relative;z-index:2;text-align:center;background:#fff;color:var(--ink);padding:24px 54px 26px;border:4px solid var(--ink);border-radius:26px;box-shadow:10px 10px 0 var(--v);transform:rotate(-3deg);animation:eyeIn .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes eyeIn{from{transform:scale(0) rotate(-25deg)}}
.ey-ep{font-family:'Dela Gothic One',sans-serif;font-size:20px;color:var(--p);letter-spacing:.3em}
.ey-title{font-family:'Dela Gothic One',sans-serif;font-size:clamp(28px,5vw,58px);line-height:1.1;margin:8px 0}
.ey-sub{font-weight:800;font-size:15px;letter-spacing:.5em;color:var(--v)}
.ey-hint{position:absolute;bottom:8vh;left:0;right:0;text-align:center;z-index:2;font-weight:800;font-size:11px;letter-spacing:.3em;color:#fff;opacity:.8}
#ak-eye.out{animation:eyeOut .7s cubic-bezier(.7,0,.3,1) forwards;pointer-events:none}
@keyframes eyeOut{to{clip-path:polygon(130% 0,130% 0,100% 100%,100% 100%)}}

@media (max-width:760px){.ak-hint{display:none}}
#ak-unlock{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:260;background:#fff;color:var(--ink);font-weight:800;font-size:13px;letter-spacing:.06em;padding:10px 18px;border:3px solid var(--ink);border-radius:999px;box-shadow:5px 5px 0 var(--p);cursor:pointer;animation:akU 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes akU{50%{transform:translate(-50%,-5px)}}
/*AK_CSS_END*/
body{background:#1d2a1f}

<script>
/*AK_JS_BEGIN*/
/* ================= ANIME SOUND — tudo sintetizado com Web Audio ================= */
const AS=(()=>{
  const KEY='anime-sfx',R=Math.random;let ctx=null,master=null,on=true,fired=false,lastSpark=0;
  try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  const emit=v=>setTimeout(()=>document.dispatchEvent(new CustomEvent('ak-sound',{detail:v})),0);
  function ensure(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();const cp=ctx.createDynamicsCompressor();master=ctx.createGain();master.gain.value=.9;master.connect(cp).connect(ctx.destination)}catch(e){return null}}
    const go=()=>{if(on&&!fired&&ctx.state==='running'){fired=true;emit(true)}};if(ctx.state!=='running')ctx.resume().then(go).catch(()=>{});else go();return ctx}
  const ok=()=>on&&!!ctx&&ctx.state==='running';
  const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760,2093];
  const MIYAKO=[293.66,311.13,392,440,466.16,587.33,622.25,783.99,880,932.33,1174.66];
  function tone(f,d=.6,v=.05,type='sine',when=0,f2){if(!ok())return;const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
  function noise(d=.4,o={}){if(!ok())return;const v=o.v??.08,type=o.type||'bandpass',f0=o.f0||800,f1=o.f1||f0,q=o.q??1,when=o.when||0,at=o.attack??.01;const t=ctx.currentTime+when,b=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*d|0),ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+d+.05)}
  function loopNoise(color='pink'){if(!ok())return null;const len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0);let l=0,b0=0,b1=0,b2=0;
    for(let i=0;i<len;i++){const w=R()*2-1;if(color==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else{b0=.99765*b0+w*.099046;b1=.963*b1+w*.2965164;b2=.57*b2+w*1.0526913;d[i]=(b0+b1+b2+w*.1848)*.18}}
    const s=ctx.createBufferSource();s.buffer=b;s.loop=true;const f=ctx.createBiquadFilter(),g=ctx.createGain();g.gain.value=0;s.connect(f).connect(g).connect(master);s.start();return {src:s,filter:f,gain:g,stop(){try{g.gain.setTargetAtTime(0,ctx.currentTime,.1);setTimeout(()=>s.stop(),400)}catch(e){}}}}
  const api={get on(){return on},ready:()=>!!ctx&&ctx.state==='running',ok,ensure,tone,noise,loopNoise,PENTA,MIYAKO,ctx:()=>ctx,out:()=>master,
    toggle(){on=!on;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}fired=false;if(on){ensure();setTimeout(()=>api.twinkle(),150)}else emit(false);document.querySelectorAll('.ak-snd').forEach(b=>b.textContent=on?'🔊 SOM':'🔇 SOM');return on},
    chime(i=0,when=0,v=.05){const f=PENTA[((i%PENTA.length)+PENTA.length)%PENTA.length];tone(f,1.2,v,'sine',when);tone(f*2,.45,v*.3,'triangle',when)},
    sparkle(){const n=performance.now();if(n-lastSpark<110)return;lastSpark=n;tone(PENTA[5+(R()*6|0)],.28,.01,'sine')},
    twinkle(v=.03){[0,2,4,7].forEach((k,i)=>api.chime(3+k,i*.055,v))},
    pop(v=.06){tone(950,.13,v,'sine',0,260)},
    whoosh(d=.5,v=.07){noise(d,{v,f0:300,f1:3800,q:1.2,attack:d*.45})},
    impact(v=.3){tone(150,.7,v,'sine',0,32);noise(.4,{v:v*.45,type:'lowpass',f0:2400,f1:150})},
    pluck(f,v=.06,when=0){tone(f,1.6,v,'triangle',when);tone(f*2.003,.4,v*.45,'sine',when);tone(f*3.01,.15,v*.22,'square',when)},
    jingle(){[2,4,6,9].forEach((k,i)=>api.chime(k,i*.1,.045));api.chime(7,.46,.04);api.chime(10,.46,.03)}
  };
  if(on)ensure();
  addEventListener('pointerdown',()=>{if(on)ensure()},true);
  addEventListener('keydown',e=>{if(on)ensure();if((e.key==='m'||e.key==='M')&&!e.repeat)api.toggle()},true);
  document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.ak-snd').forEach(b=>{b.textContent=on?'🔊 SOM':'🔇 SOM';b.addEventListener('click',e=>{e.stopPropagation();api.toggle()})});
    /* aviso: navegadores bloqueiam áudio até o 1º clique/tecla — some quando o som começa */
    const pill=document.createElement('div');pill.id='ak-unlock';pill.textContent='🔊 toque ou tecle para ativar o som ♪';
    const check=()=>{if(on&&!api.ready()){if(!pill.isConnected&&!document.getElementById('ak-gate'))document.body.appendChild(pill)}else pill.remove()};
    setTimeout(check,1200);setInterval(check,1200);addEventListener('pointerdown',()=>setTimeout(check,250),true);addEventListener('keydown',()=>setTimeout(check,250),true)});
  return api;
})();

/* ================= ANIME KIT — brilhos, onomatopeias, troca PT↔JP, eyecatch ================= */
const AK=(()=>{
  const KANA='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンあいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん☆♪♡';
  const R=Math.random,rnd=a=>a[R()*a.length|0],sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const morph=(el,final,dur=650)=>new Promise(res=>{const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/dur),n=Math.floor(final.length*k);let o='';for(let i=0;i<final.length;i++)o+=(i<n||final[i]===' ')?final[i]:rnd(KANA);el.textContent=o;if(k<1)requestAnimationFrame(f);else{el.textContent=final;res()}};requestAnimationFrame(f)});
  let cv,cx,W,H,parts=[],dirty=false;
  const COLS=['#ff7eb6','#a98bff','#ffe066','#7fe7ff','#ffffff'];
  function star(c,s){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?s*.3:s;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath()}
  function heart(c,s){c.beginPath();c.moveTo(0,s*.4);c.bezierCurveTo(s*.95,-s*.25,s*.5,-s*.95,0,-s*.4);c.bezierCurveTo(-s*.5,-s*.95,-s*.95,-s*.25,0,s*.4);c.closePath()}
  function spark(x,y,n=1,spd=1){for(let i=0;i<n;i++)parts.push({x,y,vx:(R()-.5)*2*spd,vy:(R()-.5)*2*spd-.4,life:1,dec:.014+R()*.02,s:4+R()*6,c:rnd(COLS),t:R()<.22?'h':'s',r:R()*6})}
  function burst(x,y,n=14,spd=1){for(let i=0;i<n;i++){const a=i/n*6.283+R()*.3,s=(2+R()*4)*spd;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,dec:.018+R()*.015,s:5+R()*8,c:rnd(COLS),t:R()<.3?'h':'s',r:R()*6})}}
  function loop(){
    if(parts.length||dirty){cx.clearRect(0,0,W,H);dirty=parts.length>0}
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.97;p.life-=p.dec;p.r+=.06;if(p.life<=0){parts.splice(i,1);continue}
      cx.save();cx.translate(p.x,p.y);if(p.t!=='h')cx.rotate(p.r);cx.globalAlpha=p.life;cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=10;const s=p.s*(.4+p.life*.6);p.t==='h'?heart(cx,s):star(cx,s);cx.fill();cx.restore()}
    requestAnimationFrame(loop)}
  function fxInit(){cv=document.createElement('canvas');cv.id='ak-fx';document.body.appendChild(cv);cx=cv.getContext('2d');
    const rs=()=>{const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)};addEventListener('resize',rs);rs();
    let lx=0,ly=0;addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-lx,e.clientY-ly)>16){lx=e.clientX;ly=e.clientY;spark(lx,ly,1);AS.sparkle()}});
    addEventListener('pointerdown',e=>{burst(e.clientX,e.clientY,10);AS.twinkle(.016)});requestAnimationFrame(loop)}
  function sfx(text,x,y,o={}){const d=document.createElement('div');d.className='ak-sfx';d.textContent=text;d.style.left=x+'px';d.style.top=y+'px';d.style.setProperty('--r',(o.rot??(R()-.5)*26)+'deg');if(o.size)d.style.fontSize=o.size+'px';if(o.color)d.style.color=o.color;if(o.shadow)d.style.textShadow=`4px 4px 0 ${o.shadow}`;document.body.appendChild(d);setTimeout(()=>d.remove(),1500);if(o.snd&&AS[o.snd])AS[o.snd]()}
  function swap(el){if(el._ak)return;el._ak=1;const pt=el.textContent.trim(),jp=el.dataset.jp;
    (async()=>{await sleep(1800+R()*3000);while(el.isConnected){el.classList.remove('ak-pop');void el.offsetWidth;el.classList.add('ak-pop');const b=el.getBoundingClientRect();if(b.width)burst(b.left+b.width/2,b.top+b.height/2,8,.7);AS.pop(.025);AS.chime(5+(R()*4|0),.05,.02);await morph(el,jp);await sleep(1900+R()*1500);el.classList.remove('ak-pop');void el.offsetWidth;el.classList.add('ak-pop');await morph(el,pt);await sleep(3200+R()*4000)}})()}
  let readyRes;const ready=new Promise(r=>readyRes=r);
  function eyecatch(){const ov=document.getElementById('ak-eye');if(!ov)return Promise.resolve();let done=false,res;const p=new Promise(r=>res=r);
    const fin=()=>{if(done)return;done=true;AS.ensure();AS.whoosh(.5,.05);ov.classList.add('out');setTimeout(()=>{ov.remove();res()},720)};ov.addEventListener('click',fin);addEventListener('keydown',fin,{once:true});
    /* se o áudio estiver liberado, toca o jingle e fecha sozinho; se estiver bloqueado, espera um clique (até 6s) para já entrar com som */
    setTimeout(()=>{if(AS.ready()){AS.jingle();setTimeout(fin,1700)}else{const h=ov.querySelector('.ey-hint');if(h&&AS.on)h.textContent='🔊 CLIQUE PARA COMEÇAR COM SOM';setTimeout(fin,6000)}},250);return p}
  document.addEventListener('DOMContentLoaded',()=>{fxInit();document.querySelectorAll('[data-jp]').forEach(swap);eyecatch().then(readyRes)});
  return {R,rnd,sleep,morph,spark,burst,sfx,swap,ready,KANA};
})();
/*AK_JS_END*/

const cv=document.getElementById('cv'),c=cv.getContext('2d'),R=Math.random,TAU=Math.PI*2;
let W,H,dpr,PX,PY,PRX,PRY,edge,koi=[],food=[],ripples=[],pads=[],petals=[],caust=[],mx=-999,my=-999,lastMove=0,fed=0,shishi={a:0,fill:0,state:0};
const PATTERNS=[{n:'kohaku',base:'#fff6ee',spots:'#e8442a'},{n:'showa',base:'#1b1414',spots:'#f05a2a',w:'#fff'},{n:'ogon',base:'#ffb52e',spots:null},{n:'sanke',base:'#fff6ee',spots:'#e8442a',b:'#151010'},{n:'chagoi',base:'#a8743e',spots:null},{n:'asagi',base:'#7fa6c9',spots:'#f06a3a'},{n:'kohaku2',base:'#fff6ee',spots:'#ff7a3d'}];
const inPond=(x,y,m=0)=>((x-PX)/(PRX-m))**2+((y-PY)/(PRY-m))**2<1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;c.setTransform(dpr,0,0,dpr,0,0);PX=W/2;PY=H*.53;PRX=W*.44;PRY=H*.38;
  edge=document.createElement('canvas');edge.width=W*dpr;edge.height=H*dpr;const e=edge.getContext('2d');e.setTransform(dpr,0,0,dpr,0,0);
  const gg=e.createLinearGradient(0,0,0,H);gg.addColorStop(0,'#22341f');gg.addColorStop(1,'#16231a');e.fillStyle=gg;e.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){e.fillStyle=`rgba(${R()<.5?'60,110,60':'40,80,40'},${R()*.5})`;e.fillRect(R()*W,R()*H,2+R()*3,2+R()*3)}
  e.save();e.beginPath();e.rect(0,0,W,H);e.ellipse(PX,PY,PRX,PRY,0,0,TAU);e.restore();
  for(let i=0;i<70;i++){const a=i/70*TAU+R()*.05,rx=PRX+10+R()*16,ry=PRY+8+R()*14,x=PX+Math.cos(a)*rx,y=PY+Math.sin(a)*ry,s=16+R()*22;const g=e.createRadialGradient(x-s*.3,y-s*.3,2,x,y,s);g.addColorStop(0,'#b9b3a8');g.addColorStop(1,'#5a5650');e.fillStyle='rgba(0,0,0,.35)';e.beginPath();e.ellipse(x+4,y+5,s,s*.75,a,0,TAU);e.fill();e.fillStyle=g;e.beginPath();e.ellipse(x,y,s,s*.75,a,0,TAU);e.fill();if(R()<.4){e.fillStyle='rgba(90,150,70,.55)';e.beginPath();e.ellipse(x-s*.2,y-s*.3,s*.5,s*.25,a,0,TAU);e.fill()}}
  // bambus do shishi-odoshi
  pads=Array.from({length:9},()=>{let x,y;do{x=PX+(R()-.5)*PRX*1.8;y=PY+(R()-.5)*PRY*1.8}while(!inPond(x,y,60));return {x,y,r:24+R()*22,a:R()*TAU,va:(R()-.5)*.002,flower:R()<.4,ph:R()*TAU}});
  caust=Array.from({length:46},()=>({y:R(),ph:R()*TAU,sp:.3+R()*.6,amp:6+R()*14,f:.004+R()*.01}));
  if(!koi.length)koi=PATTERNS.map((p,i)=>mkKoi(p,i));
}
function mkKoi(p,i){const x=PX+(R()-.5)*PRX,y=PY+(R()-.5)*PRY,a=R()*TAU,L=60+R()*40;const sp=[];for(let k=0;k<14;k++)sp.push([x-Math.cos(a)*k*L/13,y-Math.sin(a)*k*L/13]);
  const spots=Array.from({length:4+(R()*3|0)},()=>({k:1+R()*9,o:(R()-.5)*.8,r:.4+R()*.5}));return {p,sp,a,ta:a,v:1,L,seg:L/13,W:L*.2,spots,ph:R()*TAU}}
function steer(f){const h=f.sp[0];let tx=null,ty=null;
  if(food.length){let best=null,bd=1e9;for(const fd of food){const d=Math.hypot(fd.x-h[0],fd.y-h[1]);if(d<bd){bd=d;best=fd}}if(best&&bd<PRX*1.5){tx=best.x;ty=best.y;if(bd<f.W*.9){best.eaten=true;eat(best)}}}
  if(tx===null&&mx>0&&performance.now()-lastMove<2500&&inPond(mx,my)){const d=Math.hypot(mx-h[0],my-h[1]);if(d<PRX*.9&&d>30){tx=mx;ty=my}}
  if(tx!==null){f.ta=Math.atan2(ty-h[1],tx-h[0]);f.v+=(2.2-f.v)*.04}else{if(R()<.01)f.ta+=(R()-.5)*1.6;f.v+=(1.1-f.v)*.02}
  const nx=h[0]+Math.cos(f.a)*60,ny=h[1]+Math.sin(f.a)*60;if(!inPond(nx,ny,40)){f.ta=Math.atan2(PY-h[1],PX-h[0])+(R()-.5)*.6}
  let d=f.ta-f.a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;f.a+=d*.045;f.ph+=.12*f.v;
  h[0]+=Math.cos(f.a)*f.v;h[1]+=Math.sin(f.a)*f.v;
  for(let k=1;k<f.sp.length;k++){const p=f.sp[k],q=f.sp[k-1];const ang=Math.atan2(p[1]-q[1],p[0]-q[0])+Math.sin(f.ph-k*.5)*.06*(k/13);p[0]=q[0]+Math.cos(ang)*f.seg;p[1]=q[1]+Math.sin(ang)*f.seg}}
const PROF=[.55,.82,.96,1,.98,.92,.84,.74,.62,.5,.38,.27,.18,.12];
function bodyPath(f,dx=0,dy=0){const L=[],Rr=[];for(let k=0;k<f.sp.length;k++){const p=f.sp[k],q=f.sp[Math.min(k+1,f.sp.length-1)],pr=f.sp[Math.max(k-1,0)];const ang=Math.atan2(pr[1]-q[1],pr[0]-q[0]);const w=f.W*PROF[k];L.push([p[0]+Math.cos(ang+Math.PI/2)*w+dx,p[1]+Math.sin(ang+Math.PI/2)*w+dy]);Rr.push([p[0]+Math.cos(ang-Math.PI/2)*w+dx,p[1]+Math.sin(ang-Math.PI/2)*w+dy])}
  const h=f.sp[0];c.beginPath();c.moveTo(L[0][0],L[0][1]);c.quadraticCurveTo(h[0]+Math.cos(f.a)*f.W*1.1+dx,h[1]+Math.sin(f.a)*f.W*1.1+dy,Rr[0][0],Rr[0][1]);for(let k=1;k<Rr.length;k++)c.lineTo(Rr[k][0],Rr[k][1]);for(let k=L.length-1;k>=1;k--)c.lineTo(L[k][0],L[k][1]);c.closePath()}
function drawKoi(f){const sp=f.sp,h=sp[0],tail=sp[sp.length-1],pre=sp[sp.length-3];
  // sombra
  c.fillStyle='rgba(0,20,25,.35)';bodyPath(f,10,14);c.fill();
  // nadadeiras peitorais
  const fa=Math.atan2(sp[2][1]-sp[3][1],sp[2][0]-sp[3][0]);for(const s of [1,-1]){c.save();c.translate(sp[3][0],sp[3][1]);c.rotate(fa+s*(1.9+Math.sin(f.ph*1.3)*.25));c.fillStyle='rgba(255,255,255,.45)';c.beginPath();c.ellipse(f.W*.9,0,f.W*.9,f.W*.4,0,0,TAU);c.fill();c.restore()}
  // cauda
  const ta=Math.atan2(tail[1]-pre[1],tail[0]-pre[0])+Math.sin(f.ph)*.35;c.save();c.translate(tail[0],tail[1]);c.rotate(ta);c.fillStyle=f.p.n==='showa'?'rgba(40,30,30,.75)':'rgba(255,240,230,.6)';c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(f.W*1.2,-f.W*1.3,f.W*1.9,-f.W*1.1);c.quadraticCurveTo(f.W*1.2,0,f.W*1.9,f.W*1.1);c.quadraticCurveTo(f.W*1.2,f.W*1.3,0,0);c.fill();c.restore();
  // corpo
  c.save();bodyPath(f);c.fillStyle=f.p.base;c.fill();c.clip();
  if(f.p.spots){for(const s of f.spots){const k=Math.floor(s.k),p=sp[k],q=sp[k+1]||p;const ang=Math.atan2(p[1]-q[1],p[0]-q[0]);const x=p[0]+Math.cos(ang+Math.PI/2)*s.o*f.W,y=p[1]+Math.sin(ang+Math.PI/2)*s.o*f.W;c.fillStyle=f.p.spots;c.beginPath();c.ellipse(x,y,f.W*s.r*1.6,f.W*s.r,ang,0,TAU);c.fill()}}
  if(f.p.b){for(let k=3;k<11;k+=3){c.fillStyle=f.p.b;c.beginPath();c.arc(sp[k][0],sp[k][1],f.W*.25,0,TAU);c.fill()}}
  if(f.p.w){for(let k=2;k<9;k+=3){c.fillStyle=f.p.w;c.beginPath();c.arc(sp[k][0]+f.W*.3,sp[k][1],f.W*.35,0,TAU);c.fill()}}
  const sh=c.createLinearGradient(h[0]-f.W,h[1]-f.W,h[0]+f.W,h[1]+f.W);sh.addColorStop(0,'rgba(255,255,255,.25)');sh.addColorStop(1,'rgba(0,0,0,.15)');c.fillStyle=sh;c.fillRect(h[0]-f.L*1.2,h[1]-f.L*1.2,f.L*2.4,f.L*2.4);
  c.restore();
  // olhos e barbilhões
  for(const s of [1,-1]){const ex=h[0]+Math.cos(f.a+s*.55)*f.W*.65,ey=h[1]+Math.sin(f.a+s*.55)*f.W*.65;c.fillStyle='#140a10';c.beginPath();c.arc(ex,ey,f.W*.12,0,TAU);c.fill()}
}
function eat(fd){fed++;document.getElementById('fed').textContent=fed;ripples.push({x:fd.x,y:fd.y,r:2,a:.8});if(R()<.5)AK.sfx('パクッ',fd.x,fd.y-24,{size:28,shadow:'#ff7a3d'});if(AS.ok()){AS.tone(620,.14,.08,'sine',0,180);AS.noise(.08,{v:.05,type:'lowpass',f0:1500})}}
function draw(T){
  c.drawImage(edge,0,0,W,H);
  c.save();c.beginPath();c.ellipse(PX,PY,PRX,PRY,0,0,TAU);c.clip();
  const wg=c.createRadialGradient(PX,PY-PRY*.2,10,PX,PY,Math.max(PRX,PRY));wg.addColorStop(0,'#17808a');wg.addColorStop(.6,'#0e5a64');wg.addColorStop(1,'#073940');c.fillStyle=wg;c.fillRect(PX-PRX,PY-PRY,PRX*2,PRY*2);
  // seixos no fundo
  c.fillStyle='rgba(0,30,35,.25)';for(let i=0;i<40;i++){const a=i*2.4,r=(i*37%100)/100;c.beginPath();c.ellipse(PX+Math.cos(a)*PRX*r,PY+Math.sin(a)*PRY*r,8+(i%5)*3,5+(i%3)*2,a,0,TAU);c.fill()}
  // cáusticas
  c.globalCompositeOperation='lighter';c.lineWidth=1.6;for(const k of caust){k.ph+=.01*k.sp;const y0=PY-PRY+k.y*PRY*2;c.strokeStyle='rgba(160,255,240,.05)';c.beginPath();for(let x=PX-PRX;x<=PX+PRX;x+=16){const y=y0+Math.sin(x*k.f+k.ph*3)*k.amp+Math.sin(x*k.f*2.3-k.ph*2)*k.amp*.5;x===PX-PRX?c.moveTo(x,y):c.lineTo(x,y)}c.stroke()}c.globalCompositeOperation='source-over';
  // comida
  for(let i=food.length-1;i>=0;i--){const fd=food[i];fd.t++;if(fd.eaten||fd.t>900){food.splice(i,1);continue}c.fillStyle=`rgba(150,95,50,${Math.max(.2,1-fd.t/900)})`;c.beginPath();c.arc(fd.x+Math.sin(fd.t*.05)*1.5,fd.y,3,0,TAU);c.fill()}
  // carpas
  for(const f of koi){steer(f);drawKoi(f)}
  // reflexo do céu
  const rg=c.createLinearGradient(PX-PRX,PY-PRY,PX+PRX,PY+PRY);rg.addColorStop(0,'rgba(255,255,255,.08)');rg.addColorStop(.5,'rgba(255,255,255,0)');rg.addColorStop(1,'rgba(255,200,230,.06)');c.fillStyle=rg;c.fillRect(PX-PRX,PY-PRY,PRX*2,PRY*2);
  // vitórias-régias
  for(const p of pads){p.a+=p.va;p.x+=Math.sin(T*.0003+p.ph)*.05;c.fillStyle='rgba(0,20,20,.3)';c.beginPath();c.arc(p.x+6,p.y+8,p.r,0,TAU);c.fill();
    c.fillStyle='#3f9a4f';c.beginPath();c.moveTo(p.x,p.y);c.arc(p.x,p.y,p.r,p.a+.25,p.a+TAU-.25);c.closePath();c.fill();c.strokeStyle='rgba(20,70,30,.6)';c.lineWidth=1;for(let k=0;k<6;k++){const a=p.a+.4+k*1;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+Math.cos(a)*p.r*.9,p.y+Math.sin(a)*p.r*.9);c.stroke()}
    if(p.flower){for(let k=0;k<8;k++){const a=k/8*TAU+T*.0002;c.fillStyle=k%2?'#ffb3d1':'#ff8fbf';c.beginPath();c.ellipse(p.x+Math.cos(a)*p.r*.32,p.y+Math.sin(a)*p.r*.32,p.r*.32,p.r*.15,a,0,TAU);c.fill()}c.fillStyle='#ffe066';c.beginPath();c.arc(p.x,p.y,p.r*.14,0,TAU);c.fill()}}
  // pétalas boiando
  if(R()<.012&&petals.length<40){let x,y;do{x=PX+(R()-.5)*PRX*2;y=PY+(R()-.5)*PRY*2}while(!inPond(x,y,20));petals.push({x,y,a:R()*TAU,s:5+R()*4,t:0});ripples.push({x,y,r:1,a:.4});if(AS.ok())AS.tone(1400+R()*500,.08,.015,'sine',0,2200)}
  for(let i=petals.length-1;i>=0;i--){const p=petals[i];p.t++;p.x+=Math.sin(T*.0005+i)*.12+.05;p.y+=Math.cos(T*.0004+i)*.08;p.a+=.002;if(p.t>2400||!inPond(p.x,p.y,10)){petals.splice(i,1);continue}c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle='rgba(255,200,222,.9)';c.beginPath();c.ellipse(0,0,p.s,p.s*.6,0,0,TAU);c.fill();c.restore()}
  // ondulações
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=1.2;r.a-=.008;if(r.a<=0){ripples.splice(i,1);continue}for(let k=0;k<2;k++){if(r.r-k*12<=0)continue;c.strokeStyle=`rgba(220,255,250,${r.a*(1-k*.4)})`;c.lineWidth=1.5;c.beginPath();c.ellipse(r.x,r.y,r.r-k*12,(r.r-k*12)*.8,0,0,TAU);c.stroke()}}
  c.restore();
  // borda d'água
  c.strokeStyle='rgba(200,255,240,.18)';c.lineWidth=3;c.beginPath();c.ellipse(PX,PY,PRX,PRY,0,0,TAU);c.stroke();
  drawShishi(T);
}
/* shishi-odoshi (bambu que bate na pedra) */
function drawShishi(T){const bx=PX+PRX*.82,by=PY-PRY*.95;const s=shishi;
  if(s.state===0){s.fill+=.0025;s.a=s.fill*.35;if(s.fill>=1){s.state=1;}}else if(s.state===1){s.a+=.12;if(s.a>=.9){s.a=.9;s.state=2;clack(bx,by)}}else{s.a-=.03;if(s.a<=-.2){s.a=-.2;s.state=0;s.fill=0}}
  c.save();c.translate(bx,by);c.fillStyle='#4a3a2a';c.fillRect(-6,-6,12,46);c.rotate(-.25+s.a*.8);c.fillStyle='#8fbf5a';c.beginPath();c.roundRect(-60,-10,110,20,8);c.fill();c.strokeStyle='#4f7a32';c.lineWidth=2;c.stroke();c.fillStyle='#4f7a32';c.fillRect(-10,-10,4,20);c.fillStyle='#2e4f20';c.beginPath();c.ellipse(-58,0,4,9,0,0,TAU);c.fill();c.restore();
  c.fillStyle='#7d7a72';c.beginPath();c.ellipse(bx-62,by+44,22,12,0,0,TAU);c.fill();
  c.strokeStyle='rgba(180,230,255,.6)';c.lineWidth=2;c.beginPath();c.moveTo(bx+70,by-40);c.quadraticCurveTo(bx+60,by-14,bx+40,by-8);c.stroke()}
function clack(x,y){AK.sfx('カコーン',x-40,y-30,{size:32,color:'#e6ffd0',shadow:'#4f7a32',rot:-6});ripples.push({x:x-62,y:y+30,r:2,a:.6});
  if(AS.ok()){const a=AS.ctx(),t=a.currentTime;[[820,.12,.18],[1640,.06,.06]].forEach(([f,d,v])=>{const o=a.createOscillator(),g=a.createGain(),bp=a.createBiquadFilter();o.frequency.value=f;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=8;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(bp).connect(g).connect(AS.out());o.start(t);o.stop(t+d+.02)});AS.noise(.04,{v:.12,type:'bandpass',f0:2500,q:3});AS.noise(.6,{v:.05,type:'bandpass',f0:900,f1:500,q:.6,when:.08,attack:.05})}}
/* interação */
cv.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;lastMove=performance.now()});
cv.addEventListener('click',e=>{if(!inPond(e.clientX,e.clientY))return;for(let k=0;k<6;k++)food.push({x:e.clientX+(R()-.5)*50,y:e.clientY+(R()-.5)*40,t:0});ripples.push({x:e.clientX,y:e.clientY,r:2,a:.9});
  if(AS.ok()){const a=AS.ctx(),t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(1100,t+.09);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g).connect(AS.out());o.start(t);o.stop(t+.16)}AK.sfx('ポチャン',e.clientX,e.clientY-30,{size:30,shadow:'#5fe3c0'})});
addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P'){for(let i=0;i<15;i++){let x,y;do{x=PX+(R()-.5)*PRX*2;y=PY+(R()-.5)*PRY*2}while(!inPond(x,y,20));petals.push({x,y,a:R()*TAU,s:5+R()*4,t:0});ripples.push({x,y,r:1,a:.35})}AS.twinkle(.03)}});
addEventListener('resize',resize);resize();
function loop(T){draw(T);requestAnimationFrame(loop)}requestAnimationFrame(loop);
/* som: água + bolhas */
let water=null;
function waterStart(){if(water||!AS.ok())return;water=AS.loopNoise('brown');water.filter.type='lowpass';water.filter.frequency.value=700;water.gain.gain.setTargetAtTime(.12,AS.ctx().currentTime,1)}
document.addEventListener('ak-sound',e=>{if(e.detail)waterStart();else if(water){water.stop();water=null}});
function bubble(){if(AS.ok()){const f=500+R()*700;AS.tone(f,.07,.025,'sine',0,f*2.2)}setTimeout(bubble,700+R()*2600)}bubble();
</script>
