<style>
:root{--a:#00ff9c;--c:#00e5ff;--r:#ff2a55;--m:#ff2bd6;--y:#ffd23f;--bg:#010407}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--a);font-family:'Share Tech Mono',Consolas,monospace;overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ===== GLITCH KIT ===== */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;white-space:inherit}
.glitch::before{color:var(--m);animation:gA 3.2s infinite steps(1)}
.glitch::after{color:var(--c);animation:gB 2.7s infinite steps(1)}
.glitch.is-glitching{animation:shake .12s infinite}
.glitch.is-glitching::before,.glitch.is-glitching::after{animation-duration:.28s}
@keyframes gA{0%,100%{clip-path:inset(0 0 100% 0);transform:none}5%{clip-path:inset(12% 0 70% 0);transform:translate(-4px,-1px)}9%{clip-path:inset(55% 0 25% 0);transform:translate(3px,1px)}13%{clip-path:inset(0 0 100% 0)}47%{clip-path:inset(80% 0 4% 0);transform:translate(-3px,0)}50%{clip-path:inset(0 0 100% 0)}}
@keyframes gB{0%,100%{clip-path:inset(100% 0 0 0);transform:none}7%{clip-path:inset(40% 0 45% 0);transform:translate(4px,1px)}11%{clip-path:inset(5% 0 85% 0);transform:translate(-3px,-1px)}15%{clip-path:inset(100% 0 0 0)}71%{clip-path:inset(62% 0 20% 0);transform:translate(2px,0)}74%{clip-path:inset(100% 0 0 0)}}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(-2px,1px) skewX(-6deg)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px) skewX(4deg)}100%{transform:translate(1px,1px)}}
@keyframes blink{50%{opacity:0}}
.scan{position:fixed;inset:0;pointer-events:none;z-index:150;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:149;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.92) 100%)}
.scanbar{position:fixed;left:0;right:0;height:120px;top:-120px;z-index:148;pointer-events:none;background:linear-gradient(to bottom,transparent,rgba(0,255,156,.05),transparent);animation:sb 7s linear infinite}
@keyframes sb{to{top:110%}}

/* ===== CANVASES ===== */
#rain,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#rain{opacity:0;transition:opacity 1.6s}
#rain.on{opacity:1}
#rain.dim{opacity:.28}
#fx{z-index:60;pointer-events:none}

/* ===== INTRO ===== */
#intro{position:fixed;inset:0;z-index:40}
#intro.jolt{animation:jolt .35s steps(5)}
@keyframes jolt{0%{transform:none;filter:none}20%{transform:translate(-18px,4px) skewX(8deg);filter:hue-rotate(90deg) saturate(3)}40%{transform:translate(14px,-3px);filter:invert(1)}60%{transform:translate(-6px,0) skewX(-12deg);filter:hue-rotate(-60deg)}80%{transform:translate(4px,2px);filter:none}100%{transform:none}}
.lb{position:fixed;left:0;right:0;height:10vh;background:#000;z-index:70;transition:transform 1.2s cubic-bezier(.7,0,.2,1);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;font-size:12px;letter-spacing:.25em;color:rgba(255,255,255,.55)}
.lb.t{top:0}.lb.b{bottom:0}
body.hub .lb.t{transform:translateY(-100%)}
body.hub .lb.b{transform:translateY(100%)}
.rec{color:var(--r)}
.rec i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--r);margin-right:8px;box-shadow:0 0 10px var(--r);animation:blink 1s steps(1) infinite}
#scrub{flex:1;height:2px;margin:0 3vw;background:rgba(255,255,255,.12);position:relative}
#scrub i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--a);box-shadow:0 0 8px var(--a)}
#scrub i::after{content:'';position:absolute;right:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#fff}
.ctrl{display:flex;gap:10px}
.ctrl button{border:1px solid rgba(255,255,255,.25);padding:6px 12px;letter-spacing:.2em;font-size:11px;color:#fff;background:rgba(255,255,255,.04)}
.ctrl button:hover{background:var(--a);color:#000;border-color:var(--a)}

#term{position:absolute;left:7vw;top:15vh;font-size:clamp(12px,1.35vw,16px);line-height:1.6;color:var(--a);text-shadow:0 0 6px rgba(0,255,156,.7);max-width:86vw;transition:opacity .4s,filter .4s}
#term.gone{opacity:0;filter:blur(4px)}
#term .ok{color:var(--a)}#term .fail{color:var(--r);text-shadow:0 0 8px var(--r)}#term .warn{color:var(--y);text-shadow:0 0 8px var(--y)}
#term .hl{color:#fff}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--a);vertical-align:-3px;animation:blink .8s steps(1) infinite;box-shadow:0 0 8px var(--a)}

#core{position:absolute;left:50%;top:50%;width:min(60vh,78vw);aspect-ratio:1;transform:translate(-50%,-50%) scale(.5);opacity:0;color:var(--c);transition:opacity .6s,transform 1.4s cubic-bezier(.2,.8,.2,1),filter .6s;filter:drop-shadow(0 0 10px rgba(0,229,255,.6))}
#core.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#core.off{opacity:0;transform:translate(-50%,-50%) scale(2.4);filter:blur(8px)}
#core svg{width:100%;height:100%;overflow:visible}
.ring{transform-box:fill-box;transform-origin:center}
.r1{animation:spin 30s linear infinite}.r2{animation:spin 12s linear infinite reverse}.r3{animation:spin 6s linear infinite}.r4{animation:spin 3s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.eye{fill:var(--r);animation:eye 1.2s infinite;filter:drop-shadow(0 0 6px var(--r))}
@keyframes eye{0%,100%{opacity:.9}50%{opacity:.35}53%{opacity:1}56%{opacity:.2}}
#pct{font-family:Orbitron,sans-serif;font-weight:700;fill:#fff;font-size:18px;letter-spacing:2px}
#alert{position:absolute;left:50%;bottom:15vh;transform:translateX(-50%);font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(16px,2.8vw,36px);color:var(--r);letter-spacing:.22em;opacity:0;text-shadow:0 0 14px var(--r);white-space:nowrap}
.side-data{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;line-height:1.7;color:rgba(0,229,255,.75);opacity:0;transition:opacity .6s}
.side-data.l{left:6vw}.side-data.r{right:6vw;text-align:right}
#core.on~.side-data{opacity:1}

#titleWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;opacity:0;pointer-events:none;transition:opacity .3s}
#title{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(34px,9vw,150px);letter-spacing:.05em;color:#eafff6;text-shadow:0 0 18px rgba(0,255,156,.9),0 0 70px rgba(0,255,156,.45);white-space:nowrap}
#sub{font-size:clamp(12px,1.5vw,20px);letter-spacing:.5em;color:var(--a);white-space:nowrap}

/* ===== HUB ===== */

.logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(20px,2.4vw,30px);letter-spacing:.12em;color:#fff;text-shadow:0 0 12px var(--a)}
.logo small{display:block;font-family:'Share Tech Mono',monospace;font-weight:400;font-size:11px;letter-spacing:.35em;color:var(--a);margin-top:4px;text-shadow:none}
.status{display:flex;gap:18px;font-size:12px;letter-spacing:.15em;align-items:center;flex-wrap:wrap}
.pill{border:1px solid rgba(0,255,156,.35);padding:5px 10px}
.pill b{color:#fff;font-weight:400}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);margin-right:6px;animation:blink 1.4s steps(1) infinite}
.threat{display:flex;gap:3px;align-items:flex-end;height:16px}
.threat i{width:5px;background:var(--a);opacity:.25}
.threat i.on{opacity:1;box-shadow:0 0 6px currentColor}
.hero{padding:46px 4vw 10px}
.hero h2{font-family:Orbitron,sans-serif;font-weight:700;font-size:clamp(22px,3.6vw,52px);color:#fff;letter-spacing:.08em;text-shadow:0 0 16px rgba(0,255,156,.6)}
.hero p{margin-top:12px;font-size:15px;color:var(--a);min-height:1.4em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;padding:30px 4vw 110px}
.card{--cc:var(--a);position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--cc);border:1px solid color-mix(in srgb,var(--cc) 30%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 10%,transparent),rgba(0,0,0,.75) 60%);padding:18px 18px 20px;min-height:250px;overflow:hidden;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));opacity:0;transform:translateY(40px);transition:background .3s,border-color .3s}
body.hub .card{animation:cardIn .8s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i) * 90ms + .5s)}
@keyframes cardIn{0%{opacity:0;transform:translateY(40px);filter:blur(6px)}40%{opacity:1;filter:blur(0) hue-rotate(80deg)}55%{opacity:.3}70%{opacity:1;filter:none}100%{opacity:1;transform:none}}
.card:hover{border-color:var(--cc);background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 22%,transparent),rgba(0,0,0,.6) 70%)}
.card::before{content:'';position:absolute;left:0;right:0;height:40%;top:-45%;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--cc) 25%,transparent),transparent);pointer-events:none}
.card:hover::before{animation:sweep 1s linear infinite}
@keyframes sweep{to{top:110%}}
.card .num{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.3em;opacity:.8}
.card .ic{height:92px;display:grid;place-items:center;border:1px dashed color-mix(in srgb,var(--cc) 25%,transparent);background:rgba(0,0,0,.35)}
.card .ic svg{height:80px;width:100%;overflow:visible}
.card h3{font-family:Orbitron,sans-serif;font-weight:700;font-size:19px;letter-spacing:.1em;color:#fff;text-shadow:0 0 10px var(--cc)}
.card p{font-size:13px;line-height:1.5;color:color-mix(in srgb,var(--cc) 75%,#fff);opacity:.85}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.card .tags span{font-size:10px;letter-spacing:.15em;padding:3px 7px;border:1px solid color-mix(in srgb,var(--cc) 40%,transparent)}
.card .go{position:absolute;right:16px;bottom:14px;font-size:11px;letter-spacing:.25em;opacity:0;transform:translateX(-8px);transition:.3s}
.card:hover .go{opacity:1;transform:none}
.ticker{position:fixed;left:0;right:0;bottom:0;height:30px;z-index:35;border-top:1px solid rgba(0,255,156,.25);background:rgba(0,0,0,.85);overflow:hidden;font-size:12px;line-height:30px;letter-spacing:.12em;opacity:0;transition:opacity 1s 1s}
body.hub .ticker{opacity:1}
.ticker div{white-space:nowrap;display:inline-block;padding-left:100%;animation:tick 60s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.ticker .r{color:var(--r)}.ticker .c{color:var(--c)}

/* icon animations */
.ic .dash{animation:dsh 1s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-18}}
.ic .sy{transform-box:fill-box;transform-origin:center;animation:sy 3s linear infinite}
@keyframes sy{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.ic .rot{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}
.ic .rotc{transform-origin:50px 40px;animation:spin 2.4s linear infinite}
.ic .jit{animation:jit .9s steps(1) infinite}
@keyframes jit{0%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(6px)}60%{transform:translateX(0)}80%{transform:translateX(12px)}}
.ic .pul{animation:pul 1.6s ease-in-out infinite}
@keyframes pul{0%,100%{opacity:.25}50%{opacity:1}}
.ic .bar{transform-box:fill-box;transform-origin:bottom;animation:bar 1.2s ease-in-out infinite alternate}
@keyframes bar{from{transform:scaleY(.2)}to{transform:scaleY(1)}}

@media (max-width:700px){.side-data{display:none}.lb{font-size:9px;letter-spacing:.1em}}
</style>

<script>
/* ================= GLITCH KIT ================= */
const GK=(()=>{
  const MAP={a:'4@Λ',b:'8ß',c:'(¢',d:'Ð',e:'3€Σ',f:'ƒ',g:'96',h:'#',i:'1!|',j:'¿',k:'К',l:'1|£',m:'м',n:'И',o:'0Ø',p:'Þ',q:'9',r:'Я',s:'5$§',t:'7+†',u:'µ',v:'√',w:'Ш',x:'×',y:'¥',z:'2'};
  const SYM='!@#$%&*<>/\\|{}[]?=+~01░▒▓';
  const rnd=a=>a[Math.random()*a.length|0];
  const pick=s=>Math.random()<.72?s[0]:rnd(s);
  const leet=(s,p=.5,n=0)=>[...s].map(ch=>{const m=MAP[ch.toLowerCase()];if(m&&Math.random()<p)return pick(m);if(ch!==' '&&Math.random()<n)return rnd(SYM);return ch}).join('');
  const set=(el,t)=>{el.textContent=t;el.dataset.text=t};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const scramble=(el,final,dur=900)=>new Promise(res=>{const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/dur),n=final.length*k|0;let o='';for(let i=0;i<final.length;i++)o+=(i<n||final[i]===' ')?final[i]:rnd(SYM);set(el,o);if(k<1)requestAnimationFrame(f);else{set(el,final);res()}};requestAnimationFrame(f)});
  function auto(el){
    if(el._gk)return;el._gk=1;
    const orig=el.dataset.orig||el.textContent.trim();el.dataset.orig=orig;set(el,orig);
    const alts=(el.dataset.alt||'').split('|').filter(Boolean);let base=orig;
    const burst=()=>{
      if(!el.isConnected)return;
      el.classList.add('is-glitching');let n=0;const fr=4+(Math.random()*8|0);
      const iv=setInterval(()=>{set(el,leet(base,.55,.07));if(++n>=fr){clearInterval(iv);const r=Math.random();
        base=r<.28?leet(orig,.75):(r<.45&&alts.length?rnd(alts):orig);set(el,base);el.classList.remove('is-glitching');setTimeout(burst,1400+Math.random()*3600)}},55)};
    setTimeout(burst,600+Math.random()*2400);
  }
  return {MAP,SYM,rnd,leet,set,sleep,scramble,auto};
})();

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');

/* ================= SOM (WebAudio sintetizado) ================= */
const SFX={ctx:null,on:false,
  toggle(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}this.on=!this.on;if(this.ctx.state==='suspended')this.ctx.resume();$('#snd').textContent=this.on?'🔊 SOM':'🔇 SOM';if(this.on)this.beep(660,.08,.05)},
  beep(f=880,d=.04,v=.04,type='square'){if(!this.on)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d+.02)},
  noise(d=.3,v=.06){if(!this.on)return;const c=this.ctx,b=c.createBuffer(1,Math.max(1,c.sampleRate*d|0),c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();f.type='highpass';f.frequency.value=900;s.buffer=b;g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start()},
  sweep(f1=80,f2=1600,d=1.2,v=.05){if(!this.on)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f1,c.currentTime);o.frequency.exponentialRampToValueAtTime(f2,c.currentTime+d);g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d)}
};

/* ================= MATRIX RAIN ================= */

const RCH='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEF<>/*+=$#';
let RW,RH,cols,drops,spd;const FS=16;
function rsz(){RW=rain.width=innerWidth;RH=rain.height=innerHeight;cols=Math.ceil(RW/FS);drops=Array.from({length:cols},()=>Math.random()*-RH/FS);spd=Array.from({length:cols},()=>.5+Math.random()*.8);rc.fillStyle='#010407';rc.fillRect(0,0,RW,RH);fxR()}
function drawRain(){
  rc.fillStyle='rgba(1,4,7,.10)';rc.fillRect(0,0,RW,RH);rc.font=FS+'px monospace';
  for(let i=0;i<cols;i++){
    const y=drops[i]*FS;
    if(y>0){rc.fillStyle='rgba(0,255,156,.85)';rc.fillText(GK.rnd(RCH),i*FS,y-FS);rc.fillStyle='#e6fff3';rc.fillText(GK.rnd(RCH),i*FS,y)}
    drops[i]+=spd[i];if(y>RH&&Math.random()>.975)drops[i]=0;
  }
}

const fx=$('#fx'),fc=fx.getContext('2d');
const nz=document.createElement('canvas');nz.width=200;nz.height=112;const nc=nz.getContext('2d');const nimg=nc.createImageData(200,112);
let noiseUntil=0,noiseA=.6,introRunning=true;
function fxR(){fx.width=innerWidth;fx.height=innerHeight}
function noise(ms,a=.6){noiseUntil=performance.now()+ms;noiseA=a;SFX.noise(ms/1000,.07*a)}
function drawFx(now){
  fc.clearRect(0,0,fx.width,fx.height);
  if(now<noiseUntil){
    const d=nimg.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=v*.6;d[i+1]=v;d[i+2]=v*.8;d[i+3]=255}
    nc.putImageData(nimg,0,0);fc.globalAlpha=noiseA*(.6+Math.random()*.4);fc.imageSmoothingEnabled=false;fc.drawImage(nz,0,0,fx.width,fx.height);
    for(let k=0;k<7;k++){fc.fillStyle=GK.rnd(['rgba(255,42,85,.6)','rgba(0,229,255,.6)','rgba(0,255,156,.6)','rgba(255,255,255,.7)','rgba(0,0,0,.9)']);fc.fillRect(0,Math.random()*fx.height,fx.width,Math.random()*24+2)}
    fc.globalAlpha=1;
  }else if(Math.random()<.02){
    fc.fillStyle=GK.rnd(['rgba(0,255,156,.22)','rgba(255,42,85,.2)','rgba(255,255,255,.15)']);fc.fillRect(0,Math.random()*fx.height,fx.width,1+Math.random()*3);
  }
}

const T0=performance.now(),INTRO_LEN=15.5;
function timecode(now){const t=(now-T0)/1000,f=Math.floor((t%1)*24),s=Math.floor(t)%60,m=Math.floor(t/60);$('#tc').textContent=`00:${pad(m)}:${pad(s)}:${pad(f)}`;$('#scrub i').style.width=Math.min(100,t/INTRO_LEN*100)+'%'}

/* ================= LOOP ================= */
let lastR=0;
function loop(now){
  if(now-lastR>33){drawRain();lastR=now}
  drawFx(now);if(introRunning)timecode(now);
  requestAnimationFrame(loop);
}
addEventListener('resize',rsz);rsz();requestAnimationFrame(loop);

async function typeLine(txt,status,cls){
  const d=document.createElement('div');term.insertBefore(d,cur);
  const s=document.createElement('span');if(!status)s.className=cls;d.appendChild(s);
  for(let i=0;i<txt.length;i++){
    if(SKIP){s.textContent=txt;break}
    s.textContent=txt.slice(0,i+1)+(Math.random()<.35?GK.rnd(GK.SYM):'');
    if(i%3===0)SFX.beep(1400+Math.random()*900,.012,.018);
    await wait(txt[i]==='.'?2:13);
  }
  s.textContent=txt;
  if(status){const st=document.createElement('span');st.className=cls;st.textContent=status;d.appendChild(st);SFX.beep(cls==='fail'?180:cls==='warn'?420:980,.07,.04)}
  if(cls==='fail'){noise(180,.35);jolt();
    const lines=[...term.querySelectorAll('div span:first-child')];const keep=lines.map(l=>l.textContent);
    lines.forEach(l=>l.textContent=GK.leet(l.textContent,.7,.08));await wait(160);lines.forEach((l,i)=>l.textContent=keep[i]);}
}
function sideData(){
  const l=$('#sdl'),r=$('#sdr');

  const iv=setInterval(()=>{if(!introRunning)return clearInterval(iv);l.innerHTML=rows();r.innerHTML=rows()},120);
}
function alertLoop(){
  const a=$('#alert'),base='INTRUSÃO DETECTADA';a.style.opacity=1;
  const iv=setInterval(()=>{if(a.dataset.stop){clearInterval(iv);return}
    const r=Math.random();a.textContent=r<.35?GK.leet(base,.65,.08):base;a.style.opacity=r<.12?.2:1;
    if(Math.random()<.1)SFX.beep(240,.05,.03,'sawtooth')},90);
}
function runProgress(ms){
  return new Promise(res=>{
    const p=$('#prog'),t=$('#pct'),t0=performance.now();
    const f=now=>{
      const k=SKIP?1:Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,2);
      p.setAttribute('stroke-dashoffset',867*(1-e));t.textContent=String(Math.floor(e*100)).padStart(2,'0')+'%';
      if(Math.random()<.2)SFX.beep(300+e*900,.02,.02);
      k<1?requestAnimationFrame(f):res();
    };requestAnimationFrame(f);
  });
}
