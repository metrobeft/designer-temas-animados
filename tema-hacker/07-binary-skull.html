/* ===== GLITCH KIT ===== */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;white-space:inherit}
.glitch::before{color:var(--m);animation:gA 3.2s infinite steps(1)}
.glitch::after{color:var(--c);animation:gB 2.7s infinite steps(1)}
.glitch.is-glitching{animation:shake .12s infinite}
.glitch.is-glitching::before,.glitch.is-glitching::after{animation-duration:.28s}
@keyframes gA{0%,100%{clip-path:inset(0 0 100% 0);transform:none}5%{clip-path:inset(12% 0 70% 0);transform:translate(-4px,-1px)}9%{clip-path:inset(55% 0 25% 0);transform:translate(3px,1px)}13%{clip-path:inset(0 0 100% 0)}47%{clip-path:inset(80% 0 4% 0);transform:translate(-3px,0)}50%{clip-path:inset(0 0 100% 0)}}
@keyframes gB{0%,100%{clip-path:inset(100% 0 0 0);transform:none}7%{clip-path:inset(40% 0 45% 0);transform:translate(4px,1px)}11%{clip-path:inset(5% 0 85% 0);transform:translate(-3px,-1px)}15%{clip-path:inset(100% 0 0 0)}71%{clip-path:inset(62% 0 20% 0);transform:translate(2px,0)}74%{clip-path:inset(100% 0 0 0)}}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(-2px,1px) skewX(-6deg)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px) skewX(4deg)}100%{transform:translate(1px,1px)}}

<script>
/* ================= GLITCH KIT ================= */
const GK=(()=>{
  const MAP={a:'4@Λ',b:'8ß',c:'(¢',d:'Ð',e:'3€Σ',f:'ƒ',g:'96',h:'#',i:'1!|',j:'¿',k:'К',l:'1|£',m:'м',n:'И',o:'0Ø',p:'Þ',q:'9',r:'Я',s:'5$§',t:'7+†',u:'µ',v:'√',w:'Ш',x:'×',y:'¥',z:'2'};
  const SYM='!@#$%&*<>/\\|{}[]?=+~01░▒▓';
  const rnd=a=>a[Math.random()*a.length|0];
  const pick=s=>Math.random()<.72?s[0]:rnd(s);
  const leet=(s,p=.5,n=0)=>[...s].map(ch=>{const m=MAP[ch.toLowerCase()];if(m&&Math.random()<p)return pick(m);if(ch!==' '&&Math.random()<n)return rnd(SYM);return ch}).join('');
  const set=(el,t)=>{el.textContent=t;el.dataset.text=t};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const scramble=(el,final,dur=900)=>new Promise(res=>{const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/dur),n=final.length*k|0;let o='';for(let i=0;i<final.length;i++)o+=(i<n||final[i]===' ')?final[i]:rnd(SYM);set(el,o);if(k<1)requestAnimationFrame(f);else{set(el,final);res()}};requestAnimationFrame(f)});
  function auto(el){
    if(el._gk)return;el._gk=1;
    const orig=el.dataset.orig||el.textContent.trim();el.dataset.orig=orig;set(el,orig);
    const alts=(el.dataset.alt||'').split('|').filter(Boolean);let base=orig;
    const burst=()=>{
      if(!el.isConnected)return;
      el.classList.add('is-glitching');if(typeof HX!=='undefined')HX.autoGlitch();let n=0;const fr=4+(Math.random()*8|0);
      const iv=setInterval(()=>{set(el,leet(base,.55,.07));if(++n>=fr){clearInterval(iv);const r=Math.random();
        base=r<.28?leet(orig,.75):(r<.45&&alts.length?rnd(alts):orig);set(el,base);el.classList.remove('is-glitching');setTimeout(burst,1400+Math.random()*3600)}},55)};
    setTimeout(burst,600+Math.random()*2400);
  }
  function boot(title,lines){
    const ov=document.getElementById('gk-boot');if(!ov)return;
    const t=ov.querySelector('.bt-title'),bar=ov.querySelector('.bt-bar i'),log=ov.querySelector('.bt-log');
    let done=false;const fin=()=>{if(done)return;done=true;ov.classList.add('out');if(typeof HX!=='undefined'){HX.glitch(.18,.6);HX.tvOn(.8)}setTimeout(()=>ov.remove(),700)};
    ov.addEventListener('click',fin);addEventListener('keydown',fin,{once:true});
    scramble(t,title,800);if(typeof HX!=='undefined')HX.blips(8);
    (async()=>{for(let i=0;i<lines.length&&!done;i++){await sleep(160+Math.random()*140);const d=document.createElement('div');d.textContent='> '+lines[i];log.appendChild(d);if(typeof HX!=='undefined')HX.typeBurst(Math.min(12,(lines[i].length/2|0)+3),.17,.6);bar.style.width=((i+1)/lines.length*100)+'%'}await sleep(380);fin()})();
  }
  document.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('[data-glitch]').forEach(auto));
  return {MAP,SYM,rnd,leet,set,sleep,scramble,auto,boot};
})();

/* ================= HX · SONS SINTETIZADOS (Web Audio, sem arquivos) =================
   teclado mecânico · glitch digital · estática de TV · TV de tubo desligando/ligando
   alarme · ping de sonar · bipes de dados · voz robótica · zumbido ambiente
   Ligado por padrão (desliga no botão 🔊 SOM ou tecla M. Preferência salva em localStorage('hacker-sfx'). */
const HX=(()=>{
  const KEY='hacker-sfx',R=Math.random,T={};let on=true;try{on=localStorage.getItem(KEY)!=='0'}catch(e){}
  let ctx=null,master=null,nbuf=null,crush=null,hum=null,bedG=null,lastBed=0;
  function ensure(){
    if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return Promise.resolve()}
      const comp=ctx.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=14;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.25;
      master=ctx.createGain();master.gain.value=.85;master.connect(comp);comp.connect(ctx.destination);
      nbuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;
      crush=new Float32Array(256);for(let i=0;i<256;i++){const x=i/127.5-1;crush[i]=Math.round(x*3)/3}}
    const p=ctx.state==='suspended'?ctx.resume():Promise.resolve();
    return p.then(()=>{if(on)startHum()}).catch(()=>{});
  }
  const ok=()=>on&&ctx&&ctx.state==='running';
  const t0=()=>ctx.currentTime;
  const noise=()=>{const s=ctx.createBufferSource();s.buffer=nbuf;s.loop=true;return s};
  const filt=(type,f,q=1)=>{const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;return b};
  const gain=(v=0)=>{const g=ctx.createGain();g.gain.value=v;return g};
  const osc=(type,f,t)=>{const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t??ctx.currentTime);return o};
  const chain=(...n)=>{for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);n[n.length-1].connect(master);return n[0]};
  function limited(k,s){const n=performance.now();if(T[k]&&n-T[k]<s*1000)return false;T[k]=n;return true}

  /* teclado mecânico: clique (ruído em banda) + baque grave + estalo de soltura */
  function keyAt(t,heavy,vol){
    const s=noise(),g=gain();g.gain.setValueAtTime((heavy?.3:.2)*vol*(.7+R()*.5),t);g.gain.exponentialRampToValueAtTime(.0001,t+(heavy?.045:.026));
    chain(s,filt('bandpass',(heavy?1300:1800)+R()*2700,heavy?1.1:2.4),g);s.start(t,R()*1.5);s.stop(t+.06);
    const o=osc('sine',(heavy?110:150)+R()*40,t),og=gain();o.frequency.exponentialRampToValueAtTime(55,t+.03);og.gain.setValueAtTime((heavy?.22:.1)*vol,t);og.gain.exponentialRampToValueAtTime(.0001,t+.035);chain(o,og);o.start(t);o.stop(t+.04);
    const r=t+.045+R()*.035,s2=noise(),g2=gain();g2.gain.setValueAtTime(.06*vol,r);g2.gain.exponentialRampToValueAtTime(.0001,r+.015);chain(s2,filt('bandpass',3500+R()*2000,3),g2);s2.start(r,R());s2.stop(r+.02);
  }
  function key(heavy=false,vol=1){if(!ok()||!limited('key',.022))return;keyAt(t0(),heavy,vol)}
  function typeBurst(n=6,span=.18,vol=.7){if(!ok())return;const t=t0();for(let i=0;i<n;i++)keyAt(t+i*span/n+R()*.01,R()<.12,vol)}

  /* glitch digital: oscilador com saltos de frequência + bitcrush + ruído picotado */
  function glitch(d=.22,v=1){if(!ok())return;const t=t0();
    const o=osc(R()<.5?'square':'sawtooth',300,t),sh=ctx.createWaveShaper(),g=gain();sh.curve=crush;g.gain.setValueAtTime(0,t);
    for(let x=t;x<t+d;x+=.03+R()*.05){o.frequency.setValueAtTime(60+R()*2600,x);g.gain.setValueAtTime(R()<.22?0:.075*v,x)}
    g.gain.setValueAtTime(0,t+d);chain(o,sh,g);o.start(t);o.stop(t+d+.02);
    const s=noise(),ng=gain();ng.gain.setValueAtTime(0,t);for(let x=t;x<t+d;x+=.008+R()*.028)ng.gain.setValueAtTime(R()<.5?.11*v:0,x);ng.gain.setValueAtTime(0,t+d);
    chain(s,filt('highpass',1100),ng);s.start(t,R());s.stop(t+d+.02)}
  const glitchSoft=()=>{if(limited('gs',.7))glitch(.1,.35)};
  const autoGlitch=()=>{if(limited('auto',1.2))glitch(.07,.25)};

  /* estática de TV com tremulação */
  function stat(d=.4,v=.5){if(!ok())return;const t=t0(),s=noise(),g=gain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.15*v,t+.01);
    for(let k=.02;k<d-.03;k+=.022)g.gain.setValueAtTime(.15*v*(.45+R()*.65),t+k);g.gain.setValueAtTime(.09*v,t+Math.max(.02,d-.03));g.gain.exponentialRampToValueAtTime(.0001,t+d);
    chain(s,filt('highpass',900),g);s.start(t,R());s.stop(t+d+.02)}

  /* TV de tubo desligando: baque, estalo, apito agudo sumindo, varredura descendo, cauda de estática */
  function tvOff(v=1){if(!ok())return;const t=t0();
    const o=osc('sine',95,t),g=gain();o.frequency.exponentialRampToValueAtTime(32,t+.2);g.gain.setValueAtTime(.4*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.24);chain(o,g);o.start(t);o.stop(t+.26);
    const s=noise(),sg=gain();sg.gain.setValueAtTime(.3*v,t);sg.gain.exponentialRampToValueAtTime(.0001,t+.06);chain(s,filt('lowpass',2600),sg);s.start(t,R());s.stop(t+.08);
    const w=osc('sine',10500+R()*1500,t),wg=gain();w.frequency.linearRampToValueAtTime(9000,t+.7);wg.gain.setValueAtTime(.03*v,t);wg.gain.exponentialRampToValueAtTime(.0001,t+.75);chain(w,wg);w.start(t);w.stop(t+.78);
    const d=osc('sawtooth',1500,t+.02),dg=gain();d.frequency.exponentialRampToValueAtTime(50,t+.36);dg.gain.setValueAtTime(.0001,t);dg.gain.linearRampToValueAtTime(.07*v,t+.03);dg.gain.exponentialRampToValueAtTime(.0001,t+.38);chain(d,filt('lowpass',3000),dg);d.start(t+.02);d.stop(t+.4);
    const s2=noise(),g2=gain();g2.gain.setValueAtTime(.0001,t);g2.gain.linearRampToValueAtTime(.08*v,t+.05);g2.gain.exponentialRampToValueAtTime(.0001,t+.55);chain(s2,filt('highpass',1500),g2);s2.start(t,R());s2.stop(t+.57)}
  /* TV ligando: chiado picotado + apito subindo + zumbido */
  function tvOn(v=1){if(!ok())return;const t=t0();
    const s=noise(),g=gain();g.gain.setValueAtTime(0,t);for(let k=0;k<.28;k+=.012)g.gain.setValueAtTime(R()<.45?.14*v*(1-k/.3):0,t+k);g.gain.setValueAtTime(0,t+.3);chain(s,filt('highpass',1600),g);s.start(t,R());s.stop(t+.32);
    const w=osc('sine',6500,t),wg=gain();w.frequency.exponentialRampToValueAtTime(11500,t+.45);wg.gain.setValueAtTime(.0001,t);wg.gain.linearRampToValueAtTime(.025*v,t+.15);wg.gain.exponentialRampToValueAtTime(.0001,t+.6);chain(w,wg);w.start(t);w.stop(t+.62);
    const h=osc('sawtooth',50,t),hg=gain();hg.gain.setValueAtTime(.0001,t);hg.gain.linearRampToValueAtTime(.05*v,t+.2);hg.gain.exponentialRampToValueAtTime(.0001,t+.55);chain(h,filt('lowpass',300),hg);h.start(t);h.stop(t+.58)}
  const channel=()=>{tvOff(.55);setTimeout(()=>stat(.28,.6),140);setTimeout(()=>tvOn(.6),420)};

  /* interface */
  function beep(f=880,d=.06,v=.06,type='square',when=0){if(!ok())return;const t=t0()+when,o=osc(type,f,t),g=gain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);chain(o,filt('lowpass',5000),g);o.start(t);o.stop(t+d+.02)}
  const tick=(v=.3)=>beep(3800+R()*800,.012,.03*v,'sine');
  const blip=()=>beep(1400+R()*2200,.022,.035,'square');
  function blips(n=6){if(!ok())return;for(let i=0;i<n;i++)beep(1200+R()*2400,.022,.03,'square',i*.034)}
  function ping(f=1100,v=.3){if(!ok())return;const t=t0();for(const [dl,a] of [[0,1],[.22,.35],[.44,.12]]){const o=osc('sine',f,t+dl),g=gain();g.gain.setValueAtTime(.0001,t+dl);g.gain.linearRampToValueAtTime(.16*v*a,t+dl+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dl+1);chain(o,g);o.start(t+dl);o.stop(t+dl+1.02)}}
  function alarm(v=.6){if(!ok())return;const t=t0();for(let i=0;i<4;i++){const s=t+i*.14,o=osc('sawtooth',i%2?660:880,s),g=gain();g.gain.setValueAtTime(.0001,s);g.gain.linearRampToValueAtTime(.06*v,s+.01);g.gain.setValueAtTime(.06*v,s+.11);g.gain.exponentialRampToValueAtTime(.0001,s+.13);chain(o,filt('lowpass',2400),g);o.start(s);o.stop(s+.14)}}
  function buzzer(v=1){if(!ok())return;const t=t0();for(const f of [110,116.5]){const o=osc('square',f,t),g=gain(),lfo=osc('square',14,t),lg=gain(.035*v);g.gain.setValueAtTime(.06*v,t);g.gain.setValueAtTime(.06*v,t+.5);g.gain.exponentialRampToValueAtTime(.0001,t+.62);lfo.connect(lg);lg.connect(g.gain);chain(o,filt('lowpass',1400),g);o.start(t);lfo.start(t);o.stop(t+.64);lfo.stop(t+.64)}}
  function sweep(f1=200,f2=1600,d=.5,v=.05){if(!ok())return;const t=t0(),o=osc('sawtooth',f1,t),g=gain();o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);chain(o,filt('lowpass',3200),g);o.start(t);o.stop(t+d+.02)}
  function bloop(v=1){if(!ok())return;const t=t0(),o=osc('sine',320,t),g=gain();o.frequency.exponentialRampToValueAtTime(70,t+.25);g.gain.setValueAtTime(.22*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);chain(o,g);o.start(t);o.stop(t+.32)}
  function synth(f=440,d=.14){if(!ok())return;const t=t0(),o=osc('triangle',f,t),g=gain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.06,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);chain(o,filt('lowpass',2200),g);o.start(t);o.stop(t+d+.02)}
  /* voz robótica embaralhada (onda quadrada com saltos de tom e formante) */
  function garble(d=.24){if(!ok())return;const t=t0(),o=osc('square',120,t),bp=filt('bandpass',900,6),g=gain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.09,t+.01);
    for(let x=t;x<t+d;x+=.035+R()*.03){o.frequency.setValueAtTime(70+R()*160,x);bp.frequency.setValueAtTime(400+R()*2200,x)}g.gain.setValueAtTime(.08,t+Math.max(.02,d-.02));g.gain.exponentialRampToValueAtTime(.0001,t+d);chain(o,bp,g);o.start(t);o.stop(t+d+.02);glitch(d*.5,.25)}
  /* trava mecânica */
  function clunk(v=1){if(!ok())return;const t=t0(),s=noise(),g=gain();g.gain.setValueAtTime(.35*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.09);chain(s,filt('lowpass',700),g);s.start(t,R());s.stop(t+.1);
    const o=osc('sine',75,t),og=gain();og.gain.setValueAtTime(.3*v,t);og.gain.exponentialRampToValueAtTime(.0001,t+.18);chain(o,og);o.start(t);o.stop(t+.2);
    const c=noise(),cg=gain();cg.gain.setValueAtTime(.0001,t);cg.gain.setValueAtTime(.12*v,t+.05);cg.gain.exponentialRampToValueAtTime(.0001,t+.08);chain(c,filt('bandpass',3200,4),cg);c.start(t,R());c.stop(t+.09)}
  /* zumbido ambiente (50 Hz + harmônicos), bem baixo */
  function startHum(){if(hum||!ok())return;hum=gain(0);hum.connect(master);hum.gain.setTargetAtTime(.014,t0(),.5);hum._o=[50,100,150].map((f,i)=>{const o=osc('sine',f),g=gain([1,.5,.25][i]);o.connect(g);g.connect(hum);o.start();return o})}
  function stopHum(){if(!hum)return;const h=hum;hum=null;h.gain.setTargetAtTime(0,t0(),.1);setTimeout(()=>h._o.forEach(o=>{try{o.stop()}catch(e){}}),600)}
  /* cama contínua de estática (volume ajustável em tempo real) */
  function bed(v){if(!ctx)return;const n=performance.now();if(n-lastBed<100)return;lastBed=n;
    if(!ok()){if(bedG)bedG.gain.setTargetAtTime(0,t0(),.05);return}

    bedG.gain.setTargetAtTime(Math.max(0,v)*.1,t0(),.12)}

  function labels(){document.querySelectorAll('.hx-snd,#snd').forEach(b=>b.textContent=on?'🔊 SOM':'🔇 SOM')}
  function toggle(){on=!on;try{localStorage.setItem(KEY,on?'1':'0')}catch(e){}labels();
    if(on)ensure().then(()=>{beep(660,.08,.06);beep(990,.1,.05,'square',.09)});else{stopHum();if(bedG&&ctx)bedG.gain.setTargetAtTime(0,t0(),.05)}}
  addEventListener('pointerdown',()=>{if(on)ensure()},true);
  addEventListener('keydown',e=>{if(on)ensure();if((e.key==='m'||e.key==='M')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||''))toggle()},true);
  document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.hx-snd,#snd');if(b){e.preventDefault();e.stopPropagation();toggle()}},true);
  if(on)ensure();

  return {toggle,limited,key,typeBurst,glitch,glitchSoft,autoGlitch,static:stat,tvOff,tvOn,channel,beep,tick,blip,blips,ping,alarm,buzzer,sweep,bloop,synth,garble,clunk,bed,isOn:()=>on,ready:()=>!!ctx&&ctx.state==='running',ensure};

const $=s=>document.querySelector(s),R=Math.random;

/* ================= FORMA DO CRÂNIO ================= */
const SKULL=new Path2D('M100 5 C40 5 8 48 10 100 C11 128 22 148 40 160 L42 186 C42 196 50 202 60 202 L140 202 C150 202 158 196 158 186 L160 160 C178 148 189 128 190 100 C192 48 160 5 100 5 Z');
const EYEL=new Path2D('M48 102 C46 84 62 76 80 80 C94 84 96 100 90 114 C84 126 70 130 58 124 C50 120 49 112 48 102 Z');
const EYER=new Path2D('M152 102 C154 84 138 76 120 80 C106 84 104 100 110 114 C116 126 130 130 142 124 C150 120 151 112 152 102 Z');
const NOSE=new Path2D('M100 128 L88 154 C94 158 106 158 112 154 Z');
const GAPS=new Path2D('M60 186 L140 186 M75 170 L75 202 M88 170 L88 204 M100 170 L100 204 M112 170 L112 204 M125 170 L125 202 M100 5 L104 25 L96 38 L102 54');

const cv=$('#cv'),cx=cv.getContext('2d');
let W,H,dpr,CS,S,OX,OY,parts=[],rain=[],phase='assemble',phaseT=0,mx=-999,my=-999,red=false;
const CH='01';
function build(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(H*.62/207,W*.62/200);CS=Math.max(7,Math.round(S*3.2));OX=W/2-100*S;OY=H*.47-104*S;
  const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');
  o.save();o.translate(OX,OY);o.scale(S,S);o.fillStyle='#fff';o.fill(SKULL);o.globalCompositeOperation='destination-out';o.fill(EYEL);o.fill(EYER);o.fill(NOSE);o.lineWidth=3.2;o.stroke(GAPS);o.restore();
  const img=o.getImageData(0,0,W,H).data;const on=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&img[((y|0)*W+(x|0))*4+3]>128;
  parts=[];const jawY=OY+168*S;
  for(let y=CS/2;y<H;y+=CS)for(let x=CS/2;x<W;x+=CS){if(!on(x,y))continue;
    const edge=!on(x-CS,y)||!on(x+CS,y)||!on(x,y-CS)||!on(x,y+CS);
    parts.push({tx:x,ty:y,x,y:-R()*H*1.2-20,vx:0,vy:0,delay:R()*1600+(y-OY)/S*4,edge,jaw:y>jawY,ch:GK.rnd(CH),set:false})}
  $('#pc').textContent=parts.length;
  rain=Array.from({length:Math.ceil(W/CS)},(_,i)=>({x:i*CS+CS/2,y:R()*H,sp:.6+R()*2.4,len:6+(R()*18|0)}));
  startPhase('assemble');
}
function startPhase(p){if(p==='assemble')HX.tvOn(.6);phase=p;phaseT=performance.now();$('#phase').textContent={assemble:'MONTAGEM',hold:'ATIVO',talk:'TRANSMITINDO',dissolve:'DESINTEGRAÇÃO'}[p];
  if(p==='assemble')for(const q of parts){q.x=q.tx;q.y=-R()*H*.8-20;q.vx=0;q.vy=0;q.set=false;q.delay=R()*1400+(q.ty-OY)/S*5}
  if(p==='dissolve'){HX.static(.6,.7);HX.tvOff(1);const cxs=W/2,cys=OY+100*S;for(const q of parts){const a=Math.atan2(q.y-cys,q.x-cxs),f=2+R()*6;q.vx=Math.cos(a)*f+(R()-.5)*2;q.vy=Math.sin(a)*f-R()*3}}
}
let wasOpen=false;
function update(now,dt){
  const t=now-phaseT;const jawOpen=(phase==='talk')?Math.max(0,Math.sin(t*.012))*CS*1.2*(Math.sin(t*.003)>-.3?1:0):0;if(jawOpen>0&&!wasOpen)HX.garble(.24);wasOpen=jawOpen>0;
  for(const q of parts){
    if(R()<.04)q.ch=GK.rnd(CH);
    if(phase==='assemble'){
      if(t<q.delay)continue;
      if(!q.set){q.vy=Math.min(22,q.vy+.45);q.y+=q.vy*dt*.06;if(q.y>=q.ty){q.y=q.ty;q.vy=0;q.set=true;q.flash=1;if(HX.limited('blip',.07))HX.blip()}}
    }else if(phase==='dissolve'){
      q.vy+=.12;q.x+=q.vx*dt*.06;q.y+=q.vy*dt*.06;q.vx*=.99;
    }else{
      const ty=q.ty+(q.jaw?jawOpen:0);
      q.vx+=(q.tx-q.x)*.08;q.vy+=(ty-q.y)*.08;
      const dx=q.x-mx,dy=q.y-my,d2=dx*dx+dy*dy;if(d2<120*120){const d=Math.sqrt(d2)||1,f=(1-d/120)*9;q.vx+=dx/d*f;q.vy+=dy/d*f}
      q.vx*=.72;q.vy*=.72;q.x+=q.vx;q.y+=q.vy;
    }
    if(q.flash)q.flash*=.9;
  }
  const dur={assemble:4200,hold:3200,talk:4200,dissolve:2600}[phase];
  if(t>dur){const nx={assemble:'hold',hold:'talk',talk:'dissolve',dissolve:'assemble'}[phase];if(phase==='assemble')parts.forEach(q=>{q.set=true;q.x=q.tx;q.y=q.ty});startPhase(nx)}
}
function draw(now){
  const col=red?'255,42,85':'0,255,156';
  cx.fillStyle='rgba(0,5,3,1)';cx.fillRect(0,0,W,H);
  // linhas de código binário de fundo
  cx.font=`${Math.round(CS*.95)}px 'Share Tech Mono',monospace`;cx.textAlign='center';cx.textBaseline='middle';
  for(const r of rain){r.y+=r.sp;if(r.y-r.len*CS>H){r.y=-10;r.sp=.6+R()*2.4}
    for(let j=0;j<r.len;j++){const y=r.y-j*CS;if(y<0||y>H)continue;cx.fillStyle=`rgba(${col},${(1-j/r.len)*.13})`;cx.fillText(R()<.5?'0':'1',r.x,Math.round(y/CS)*CS+CS/2)}}
  // brilho dos olhos
  const t=now-phaseT;const eyeA=(phase==='hold'||phase==='talk')?(.55+.45*Math.sin(now*.008))*(R()<.05?.2:1):phase==='assemble'?Math.min(1,Math.max(0,(t-3000)/1200)):Math.max(0,1-t/600);
  if(eyeA>0){cx.save();cx.translate(OX,OY);cx.scale(S,S);for(const [ex,ey] of [[71,103],[129,103]]){const g=cx.createRadialGradient(ex,ey,0,ex,ey,34);g.addColorStop(0,`rgba(255,40,80,${eyeA})`);g.addColorStop(.5,`rgba(255,20,60,${eyeA*.35})`);g.addColorStop(1,'rgba(255,0,40,0)');cx.fillStyle=g;cx.beginPath();cx.arc(ex,ey,34,0,7);cx.fill()}cx.restore()}
  // partículas
  const scanY=OY+((now*.18)%(260*S))-30*S;
  cx.font=`bold ${CS}px 'Share Tech Mono',monospace`;
  for(const q of parts){
    if(phase==='assemble'&&!q.set&&q.y<-CS)continue;
    let a=q.edge?1:.62,c=col;
    if(Math.abs(q.y-scanY)<CS*1.2)a=1;
    if(q.flash>.1||(Math.abs(q.y-scanY)<CS*.6)){cx.fillStyle=`rgba(230,255,245,${Math.max(a,q.flash||0)})`}
    else if(q.edge){cx.fillStyle=red?'#ff9aae':'#b8ffe0'}
    else cx.fillStyle=`rgba(${c},${a})`;
    if(phase==='assemble'&&!q.set){cx.fillStyle=`rgba(${c},.55)`}
    cx.fillText(q.ch,q.x,q.y);
  }
  // fatias de glitch
  if(R()<.035||(phase==='talk'&&R()<.08)){HX.glitchSoft();cx.save();cx.setTransform(1,0,0,1,0,0);for(let k=0;k<4;k++){const h=(4+R()*40)*dpr,y=R()*cv.height,dx=(R()-.5)*90*dpr;cx.drawImage(cv,0,y,cv.width,h,dx,y,cv.width,h)}cx.globalCompositeOperation='lighter';cx.globalAlpha=.3;cx.drawImage(cv,-5*dpr,0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';cx.restore()}
}
let last=performance.now();
function loop(now){const dt=Math.min(50,now-last);last=now;update(now,dt);draw(now);requestAnimationFrame(loop)}
addEventListener('resize',build);
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});addEventListener('mouseleave',()=>{mx=my=-999});

addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){HX.glitch(.2,.7);red=!red;document.body.classList.toggle('red',red)}});
build();requestAnimationFrame(loop);
